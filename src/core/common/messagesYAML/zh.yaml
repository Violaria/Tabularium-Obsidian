Copy database information: 复制数据库信息
Copy database information for a file: 复制文件的数据库信息
Copy database information for the active file: 复制当前文件的数据库信息
Copy failed. Select the report text and copy it manually.: 复制失败。请选中报告文本后手动复制。
Copy recovery code: 复制恢复码
Copy report: 复制报告
Copy revision, conflict, and local chunk availability information, including document and chunk identifiers but not file contents.: 复制修订版本、冲突和本地块可用性信息，包括文档和块标识符，但不包括文件内容。
CouchDB only. Version 0 preserves legacy path identity; version 1 uses Unicode NFC. Physical file names stay unchanged. Update every device and stop synchronisation, then Rebuild both databases from a complete authoritative Vault and Fetch on the other devices. Resolve colliding file names first. P2P and Object Storage do not support version 1.: 仅限 CouchDB。版本 0 保留旧版路径标识；版本 1 使用 Unicode NFC。实际文件名保持不变。请更新所有设备并停止同步，然后用一份完整且权威的笔记库重建两个数据库，再在其他设备上获取。请先解决文件名冲突。P2P 和对象存储不支持版本 1。
Could Not Read Synchronisation Settings: 无法读取同步设置
Could not read the remote's synchronisation settings. Check the connection and credentials, then retry.: 无法读取远程的同步设置。请检查连接和凭据，然后重试。
Could not read the remote's synchronisation settings. Retry, or continue the overwrite with this device's settings. A working connection is still required.: 无法读取远程的同步设置。请重试，或使用本设备的设置继续覆盖。仍然需要可用的连接。
Current ID recovery code: 当前 ID 恢复码
Current Vault file: 笔记库中的当前文件
'Current configuration: a saved ID key is used.': 当前配置：使用已保存的 ID 密钥。
'Current configuration: no ID key is saved. With E2EE enabled, keeping it uses legacy IDs tied to the E2EE passphrase.': 当前配置：未保存 ID 密钥。启用 E2EE 时，保持此配置将使用与 E2EE 密码短语绑定的旧版 ID。
'Current configuration: the saved ID key is retained while E2EE is off.': 当前配置：E2EE 关闭期间保留已保存的 ID 密钥。
"Custom headers for requesting the CouchDB. e.g. `x-custom-header1: value1\n x-custom-header2: value2`": "请求 CouchDB 时使用的自定义请求头。例如 `x-custom-header1: value1

  \ x-custom-header2: value2`"
"Custom headers for requesting the bucket. e.g. `x-custom-header1: value1\n x-custom-header2: value2`": "请求存储桶时使用的自定义请求头。例如 `x-custom-header1: value1

  \ x-custom-header2: value2`"
Data retrieval scheduled: 已安排数据获取
Database information for ${FILE}: ${FILE} 的数据库信息
Database revision: 数据库修订版本
Database revision is newer: 数据库修订版本较新
Delete local files if deleted on remote: 远程已删除时删除本地文件
Delete local files if not on remote: 远程不存在时删除本地文件
Derive from current E2EE passphrase: 从当前 E2EE 密码短语派生
Desktop only; uses more battery and network.: 仅限桌面端；会消耗更多电量和流量。
Diagnostic report: 诊断报告
Discard branch: 丢弃分支
Discard database branch ${REVISION} of ${FILE}? This creates a logical deletion for that exact live branch. The current Vault file will not be changed.: 丢弃 ${FILE} 的数据库分支 ${REVISION}？这会为该活动分支创建一个逻辑删除。笔记库中的当前文件不会改变。
Discard database revision ${REVISION} of ${FILE}? This creates a logical deletion for that exact live revision. Missing content cannot be recovered by this action.: 丢弃 ${FILE} 的数据库修订版本 ${REVISION}？这会为该活动修订版本创建一个逻辑删除。此操作无法恢复已缺失的内容。
Discard this branch: 丢弃此分支
Discard unreadable revision: 丢弃无法读取的修订版本
Discovering revisions: 正在查找修订版本
Download requested. You can also copy the report if downloads are unavailable on this device.: 已请求下载。如果本设备无法下载，也可以复制报告。
Effectively a directory. Should end with `/`. e.g., `vault-name/`.: 相当于一个目录，应以 `/` 结尾。例如 `vault-name/`。
Enable Developers' Debug Tools (If available).: 启用开发者调试工具（如果可用）。
Enable P2P Synchronization: 启用 P2P 同步
Enable forcePathStyle: 启用 forcePathStyle
Enable per-file customization sync: 启用按文件的自定义同步
Encrypt file properties (paths, times, sizes, and Chunk references) used by Hidden File Sync and Customisation Sync. This affects future writes; manually rebuild the remote database to protect existing properties. Requires E2EE V2, Property Encryption, and compatible clients on every device.: 加密隐藏文件同步和自定义同步使用的文件属性（路径、时间、大小和块引用）。此设置影响之后的写入；如需保护已有属性，请手动重建远程数据库。需要 E2EE V2、属性加密，并且每台设备都使用兼容的客户端。
