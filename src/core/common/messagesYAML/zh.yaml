  help:
    connect:
      title: "连接与更换笔记库"
      body: "打开「连接」，用 Tabularium 服务器上的账户登录。选择已有的笔记库或新建一个，填写笔记库的密码短语。


        已有的笔记库会先下载到这台设备；新建的笔记库由这台设备的文件填充。换用其他笔记库时点「重新登录或换笔记库」。「断开」撤销这台设备的凭据并清除连接。


        设备凭据有效期 30 天，设备在使用时会自动续期。"
    status:
      title: "同步状态的含义"
      body: "状态栏显示连接状态和计数。「已同步」表示没有待处理的修改；「待处理」是还没发送的文件数，会在下次同步时发送。


        离线时修改会保留，恢复联网后发送。同步失败的原因记录在日志中（维护 → 日志）。"
    passphrase:
      title: "笔记库的密码短语"
      body: "笔记在每台设备上用笔记库的密码短语加密后才发送，服务器无法读取。同一个笔记库的所有设备使用同一个密码短语。


        密码短语无法找回。丢失后服务器上的笔记无法解密；仍有文件的设备可以用这些文件新建笔记库。"
    migrate:
      title: "从旧插件迁移"
      body: "Tabularium 可以与其他同步插件在同一个库中同时运行：各自同步到自己的服务器，互不使用对方的本地数据库、设置和标记文件。要把笔记迁到 Tabularium，连接 Tabularium 服务器上已经存有这些笔记的笔记库，这台设备会从服务器获取；之后可以关闭旧插件，也可以保留它。


        其他插件也同步插件目录时，在它的设置中排除 ${pluginDir}：那里存着这台设备的凭据。"
    rebuild:
      title: "重建与解除锁定"
      body: "重建用一台设备的文件替换服务器上的笔记库，例如清理旧数据。所有者先在网页（账户设置 → 笔记库与设备 → 重建笔记库）授权设备，再在那台设备的「维护」中执行「用这台设备覆盖服务器」。


        之后笔记库会被锁定。其他设备会显示「笔记库已锁定」，需要从服务器重新获取。都获取后，在这里或网页上解除锁定。"
    errors:
      title: "常见问题"
      body: "凭据失效：设备已在服务器上删除，或凭据过期。重新登录即可。


        加密设置被拒：这台设备的设置与笔记库不一致。断开后重新连接。


        正在重建：等所有者在网页上结束重建。


        某篇笔记不同步：检查「同步」中的大小上限和排除的文件，并查看日志。


        大的笔记库首次同步需要一段时间，保持 Obsidian 打开，直到状态显示「已同步」。"
  release:
    "0.18.0": "新的设置页按用途分为连接、同步、文件排序、发送到 Kindle、外观、维护和帮助。

      内置三语帮助与版本历史。

      确认对话框写明会发生什么、对其他设备的影响。

      去掉了不适用于 Tabularium 服务器的原版入口：远程配置、Setup URI 与二维码、引导向导、隐藏文件与自定义同步、P2P。"
    "0.17.0": "书记员按配方回答：管理员设定的模型、参数与补充提示词组合，对话中可以微调。"
    "0.16.0": "服务器设置（包括发送到 Kindle 的发信）改在网页上修改。"
    "0.15.0": "书记员（Tabularius）在网页上设置；云笔记的阅读排版向 Obsidian 看齐。"
    "0.14.0": "在文件菜单中把笔记或文件夹分享为加密链接。"
    "0.13.0": "统一的网页应用：首页、云笔记、书记员与管理。"
    "0.12.0": "插件中全部改用 Tabularium 的名称；大笔记库同步更可靠；去掉误导性的版本提示。"
    "0.5.0": "书记员（Tabularius）回答关于笔记库的问题并提出修改（0.5 至 0.11）。"
    "0.4.0": "界面支持英文、中文和拉丁语；云笔记可以编辑。"
    "0.3.0": "用 Tabularium 账户登录连接；发送到 Kindle；云笔记；凭据自动续期。"
'${ROLE}: ${REVISION}': ${ROLE}：${REVISION}
(RegExp) Limit normal files to matching paths. Leave empty to allow all normal file paths. Hidden File Sync uses its own target patterns.: （正则表达式）只同步路径匹配的普通文件。留空则允许所有普通文件路径。隐藏文件同步使用自己的目标模式。
(RegExp) Skip changes to matching normal and hidden files, locally and remotely.: （正则表达式）跳过匹配的普通文件和隐藏文件在本地和远程的变更。
Accepted: 已接受
Active Remote Type: 当前远程类型
After restarting, select an online source device for the initial Fetch. The local database on this device will be rebuilt from that source. Unsynchronised files in this Vault may conflict with the fetched data.: 重启后，请选择一台在线的源设备进行首次获取。本设备上的本地数据库将根据该源设备重建。本笔记库中未同步的文件可能与获取的数据产生冲突。
All revisions and chunk availability below are a snapshot of this device's local database; the remote is not queried. Review the Vault-relative path, document identifier, content-derived chunk identifiers, and metadata before sharing this report. File contents are omitted.: 以下所有修订版本和块可用性都是本设备本地数据库的快照，不会查询远程。分享此报告前，请检查其中相对于笔记库的路径、文档标识符、由内容派生的块标识符和元数据。报告不包含文件内容。
An ID source is required to enable this option.: 启用此选项需要提供 ID 来源。
An exact target is already present; repair can remove the obsolete ID.: 已存在完全匹配的目标；修复可以移除过时的 ID。
Announce changes: 广播变更
Announce changes automatically after connecting: 连接后自动广播变更
App version: 应用版本
Application ID: 应用 ID
Apply database revision ${REVISION} to ${FILE}? The current Vault file will be overwritten.: 将数据库修订版本 ${REVISION} 应用到 ${FILE}？笔记库中的当前文件将被覆盖。
Apply database revision to Vault: 将数据库修订版本应用到笔记库
Apply logical deletion ${REVISION} to ${FILE}? The current Vault file will be removed.: 将逻辑删除 ${REVISION} 应用到 ${FILE}？笔记库中的当前文件将被移除。
Apply logical deletion to Vault: 将逻辑删除应用到笔记库
Apply pending changes now: 立即应用待处理的变更
Apply this revision to Vault: 将此修订版本应用到笔记库
Auto-accept compatible tweak mismatches: 自动接受兼容的调整值不一致
Automatically accepts mismatches that are compatible but potentially lossy by comparing tweak modification times.: 通过比较调整值的修改时间，自动接受兼容但可能丢失信息的不一致。
Automatically broadcast changes to connected peers: 自动向已连接的对等方广播变更
Automatically start P2P connection on launch: 启动时自动开始 P2P 连接
Back to matches: 返回匹配结果
Begin inspection: 开始检查
Calculating database usage: 正在计算数据库用量
Cancel all and reboot: 全部取消并重启
Cancel inspection: 取消检查
Cancelling inspection…: 正在取消检查…
Cancelling local search. Checked ${COUNT} entries.: 正在取消本地搜索。已检查 ${COUNT} 个条目。
Change CouchDB server setting: 更改 CouchDB 服务器设置
Change CouchDB server setting '${SETTING}' to '${VALUE}'?: 将 CouchDB 服务器设置「${SETTING}」更改为「${VALUE}」？
Changing the E2EE passphrase changes IDs generated by the legacy configuration.: 更改 E2EE 密码短语会改变旧版配置生成的 ID。
Checked ${COUNT} local entries.: 已检查 ${COUNT} 个本地条目。
Choose a file to inspect: 选择要检查的文件
Choose a long, unpredictable source. It is used once and cannot be shown again after saving. A recovery code can be displayed on this device later. This input also accepts a tagged recovery code.: 请选择一个足够长且无法预测的来源。它只使用一次，保存后无法再次显示。之后可以在本设备上显示恢复码。此输入框也接受带标签的恢复码。
Choose file: 选择文件
Chunk Splitter: 块分割器
Chunk revisions are always derived from their content. This stored key is retained only for compatibility.: 块的修订版本始终由其内容派生。保留此已存储的键仅为兼容。
Compare time and take newer: 比较时间并采用较新的版本
Compare with Vault: 与笔记库比较
Configure TURN when a direct connection cannot be established or when you select TURN relay only.: 当无法建立直接连接，或选择了仅使用 TURN 中继时，请配置 TURN。
Configured: 已配置
Conflict & Deletion Options: 冲突与删除选项
Conflict revision: 冲突修订版本
Connection compatibility: 连接兼容性
