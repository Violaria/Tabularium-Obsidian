The API token is saved with this profile and included in Setup URI and QR code sharing. Temporary TURN credentials are kept in memory only.: API 令牌随此配置档保存，并会包含在 Setup URI 和二维码分享中。临时 TURN 凭据只保存在内存中。
The Application ID for P2P connection. This should be same among your devices. It cannot be changed from the interface.: P2P 连接使用的应用 ID。各设备上应保持一致。无法在界面中修改。
The ID key is derived from the current E2EE passphrase and saved separately. Changing that passphrase later does not change the saved ID key. To reduce the risk of guessing that passphrase from known IDs, use a separate, unpredictable ID source instead.: ID 密钥由当前的 E2EE 密码短语派生并单独保存。之后更改该密码短语不会改变已保存的 ID 密钥。为降低通过已知 ID 猜出该密码短语的风险，请改用一个独立且无法预测的 ID 来源。
The ID source or recovery code is invalid. Check it and try again.: ID 来源或恢复码无效。请检查后重试。
The Nostr relay servers to establish connections for P2P connections. Multiple servers can be separated by commas.: 用于建立 P2P 连接的 Nostr 中继服务器。多个服务器用逗号分隔。
The P2P connection has been configured successfully. The initial synchronisation data must now be fetched from an online source device.: P2P 连接已配置成功。现在必须从一台在线的源设备获取初始同步数据。
The Passphrase for P2P connection. This should be same among your devices.: P2P 连接使用的口令。各设备上应保持一致。
The Room ID for P2P connection. This should be same among your devices.: P2P 连接使用的房间 ID。各设备上应保持一致。
The Rotation duration of token in minutes. Each generated tokens will be valid only within this duration.: 令牌的轮换时长（分钟）。生成的每个令牌只在此时长内有效。
The TURN servers to use for P2P connections. Multiple servers can be separated by commas.: P2P 连接使用的 TURN 服务器。多个服务器用逗号分隔。
The algorithm used for JWT authentication.: JWT 认证使用的算法。
The credential/password for the TURN servers.: TURN 服务器的凭据或密码。
The device information could not be loaded. Close this dialogue and open Joined devices again if the remote configuration has changed.: 无法加载设备信息。如果远程配置已更改，请关闭此对话框，然后重新打开「已加入的设备」。
The device list changed while you were trying to forget this device. Refresh the list before trying again.: 在你尝试忘记此设备期间，设备列表发生了变化。请刷新列表后再重试。
The device record was already absent.: 设备记录已不存在。
The device record was forgotten.: 已忘记该设备记录。
The displayed recovery code belongs to the current key. Reopen this dialogue after saving to copy the replacement key.: 显示的恢复码属于当前密钥。保存后请重新打开此对话框，以复制替换后的密钥。
The file could not be opened.: 无法打开该文件。
The follow-up report could not be prepared.: 无法准备后续报告。
The inspected state changed. No repair was performed; run inspection again.: 被检查的状态已发生变化。未执行修复，请重新运行检查。
The inspection could not finish. Close this dialogue and try again after database startup.: 检查无法完成。请关闭此对话框，在数据库启动后重试。
The key (PSK in HSxxx in base64, or private key in ESxxx in PEM) used for JWT authentication.: JWT 认证使用的密钥（HSxxx 使用 base64 格式的 PSK，ESxxx 使用 PEM 格式的私钥）。
The key ID. this should be matched with CouchDB->jwt_keys->ALG:_`kid`.: 密钥 ID。应与 CouchDB->jwt_keys->ALG:_`kid` 一致。
The local search could not finish.: 本地搜索无法完成。
The lookup does not read file contents or contact a remote database. Follow-up reports include current conflicts and merge bases.: 查找不会读取文件内容，也不会连接远程数据库。后续报告包含当前冲突和合并基准。
The project's public signalling relay is a best-effort convenience operated by the project author. It does not store Vault contents, but signalling metadata may be visible to the relay. Availability and log retention are not guaranteed. You can replace it with your own Nostr-compatible relay.: 项目的公共信令中继由项目作者尽力提供，仅为方便使用。它不存储笔记库内容，但中继可能看到信令元数据。不保证可用性和日志保留策略。你可以替换为自己的兼容 Nostr 的中继。
The recovery code could not be copied. Select and copy the visible code instead.: 无法复制恢复码。请选中显示的恢复码后手动复制。
The saved ID key is configured. Its source cannot be shown again.: 已配置保存的 ID 密钥。其来源无法再次显示。
The selected TURN configuration is not supported.: 不支持所选的 TURN 配置。
The selected remote has no saved synchronisation settings. This is normal for a new remote. Use this device's settings, or cancel if you expected existing settings.: 所选远程没有已保存的同步设置。对于新的远程来说这是正常的。请使用本设备的设置；如果你预期远程已有设置，请取消。
The stored document ID and recorded path are handled by different synchronisation features.: 已存储的文档 ID 和记录的路径由不同的同步功能处理。
The stored document ID does not match the ID derived from its recorded path.: 已存储的文档 ID 与根据其记录路径派生的 ID 不一致。
The subject for JWT authentication. Mostly username.: JWT 认证的主体，通常是用户名。
The username for the TURN servers.: TURN 服务器的用户名。
This device has been locked out. Use the existing recovery process to join again.: 此设备已被锁定。请使用现有的恢复流程重新加入。
This file has ${COUNT} unresolved versions. They will be reviewed one pair at a time.: 此文件有 ${COUNT} 个未解决的版本，将逐对进行审查。
This file has unresolved conflicts.: 此文件有未解决的冲突。
This list shows device information recorded by the remote. It does not show whether a device is online now.: 此列表显示远程记录的设备信息，不表示设备当前是否在线。
"This moves one local Metadata entry to the ID derived from its recorded path.\n\n**File:** `${FILE}` \ \n**Source:** `${SOURCE}@${REVISION}` \ \n**Target:** `${TARGET}`\n\nThe target is verified before the source is removed. Its CouchDB revision ancestry cannot be preserved.\n\n> [!warning] Before repairing\n> - Back up this device.\n> - If file-name case or path obfuscation was intentionally changed for the whole database, use Rebuild instead.\n> - If other devices share this database, pause them, allow this device to upload the repair, then resume them one at a time.": "此操作会将一条本地元数据条目移动到根据其记录路径派生的 ID。


  **文件：** `${FILE}` \ 

  **源：** `${SOURCE}@${REVISION}` \ 

  **目标：** `${TARGET}`


  在移除源之前会先验证目标。其 CouchDB 修订版本的祖先关系无法保留。


  > [!warning] 修复之前

  > - 备份此设备。

  > - 如果是有意为整个数据库更改了文件名大小写或路径混淆，请改用重建。

  > - 如果其他设备共享此数据库，请先暂停它们，等本设备上传修复后，再逐台恢复。"
This remote does not currently have a record of joined devices.: 此远程目前没有已加入设备的记录。
This remote does not support conditional updates, so the device record could not be removed.: 此远程不支持条件更新，因此无法移除设备记录。
This remote has been cleaned. Use the existing recovery process to join devices again as needed.: 此远程已被清理。如有需要，请使用现有的恢复流程重新加入设备。
This remote is locked. If the device returns, use the existing recovery process to join it again.: 此远程已锁定。如果设备回来，请使用现有的恢复流程让它重新加入。
This remote is locked. Use the existing recovery process for devices that need to join again.: 此远程已锁定。需要重新加入的设备请使用现有的恢复流程。
This remote is unlocked. A device that returns can register again.: 此远程已解锁。回来的设备可以重新注册。
This removes only this device's record from the remote.: 此操作只会从远程移除本设备的记录。
This report contains original paths and identifiers. Review them before sharing.: 此报告包含原始路径和标识符。分享前请仔细检查。
This report uses pseudonyms. Review its coverage before sharing.: 此报告使用化名。分享前请检查其覆盖范围。
This report uses temporary pseudonyms. Counts and relationships remain visible.: 此报告使用临时化名。数量和关联关系仍然可见。
This uses a saved key for new Chunk IDs and obfuscated Metadata document IDs, so changing the E2EE passphrase does not derive a new key automatically.: 新的块 ID 和混淆后的元数据文档 ID 使用已保存的密钥，因此更改 E2EE 密码短语不会自动派生新密钥。
