Replication stopped.: 同步已停止。
Bulk sending chunks to remote database...: 正在把数据块发送到服务器…
"↑ Uploading chunks\ \n${sendingDocs}/(${sentDocsCount} done)": |-
  ↑ 正在上传数据块 
  ${sendingDocs}/（已完成 ${sentDocsCount}）
Bulk sending failed.: 数据块发送失败。
The remote connectivity check timed out.: 检查与服务器的连接超时。
'${this.translate("couchdbReplicator.couldNotConnectToServer")} ${ret} ': '${this.translate("couchdbReplicator.couldNotConnectToServer")} ${ret} '
Some requested chunks were not found in the remote database.: 服务器上找不到部分请求的数据块。
"Collecting local files on the DB: ${count}": 正在把本机文件收入数据库：${count}
"Processing: ${processedCount}/${pairs.length}": 正在处理：${processedCount}/${pairs.length}
"Creating missing chunks: ${processed} of ${total} files": 正在补建数据块：${processed}/${total} 个文件
"Creating chunks Done: ${processed} of ${total} files": 数据块已建立：${processed}/${total} 个文件
No active replicator found: 没有设置同步
Network is offline: 网络已断开
"Synchronisation completed: ${processedCount} files processed (${completedCount} completed, ${skippedCount} skipped, ${failedCount} failed)": 同步完成：处理了 ${processedCount} 个文件（完成 ${completedCount}，跳过 ${skippedCount}，出错 ${failedCount}）
tabularium.settings.resolveAllImpact: 每篇冲突笔记的较旧版本都会被丢弃，所有设备都一样，这里无法撤销。
tabularium.release.0.18.1: 插件与网页的拉丁语统一用词。
tabularium.release.0.18.2: 书记员的新对话按开始前选的配方回答。
Allow sleep during synchronisation: 同步时允许休眠
Allow the operating system to sleep while finite synchronisation operations are in progress.: 进行有限次的同步操作时，允许操作系统进入休眠。
Allow sleep during synchronisation on the desktop: 桌面端同步时允许休眠
Desktop only. Allow sleep on this device even when the general option is disabled.: 仅桌面端。即使上面的通用选项关闭，也允许这台设备休眠。
Batch database updates in live sync mode: 实时同步时批量写入数据库
Wait for a bounded local quiet period before processing file updates in live sync mode, reducing intermediate database updates while delaying their reflection to remote devices.: 实时同步模式下，文件改动后先等本地停止编辑一小段时间（有上限）再写入数据库。这样可以减少中间版本的写入，但其他设备会晚一些收到改动。
Seconds. The quiet period after the latest pending update before local database processing becomes due.: 秒。最后一次改动之后，要停止编辑多久才写入本地数据库。
Seconds. The maximum intentional wait from the first pending update before local database processing becomes due. This does not guarantee when database processing, network delivery, or reflection to another device will complete.: 秒。从第一次未写入的改动算起，最多等多久就写入本地数据库。这不保证写入数据库、网络传输或其他设备收到改动的完成时间。
