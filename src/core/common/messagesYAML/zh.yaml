"[ReplicateResultProcessor] ${message}": "[同步结果处理] ${message}"
Failed to obtain PBKDF2 salt (Security Seed) for replication: 无法获取同步所需的安全种子（PBKDF2 盐）。
Failed to decrypt the data with V1 method. Cannot encrypt with HKDF.: 无法用 V1 方式解密数据，因此不能用 HKDF 加密。
Encryption with HKDF failed.: HKDF 加密失败。
Decryption with HKDF failed.: HKDF 解密失败。
"${path} has been merged automatically": "${path} 已自动合并"
"UPDATE DATABASE: ${file.path} has been skipped due to file size exceeding the limit": "更新数据库：${file.path} 超过大小限制，已跳过"
"UPDATE STORAGE: ${path} has been skipped due to file size exceeding the limit": "更新本地文件：${path} 超过大小限制，已跳过"
"SYNC DATABASE AND STORAGE: ${getPathFromEntry(host, doc)} has been skipped due to file size exceeding the limit": "同步数据库与本地文件：${getPathFromEntry(host, doc)} 超过大小限制，已跳过"
"Unknown features are in use: ${identifiers}": "正在使用未知功能：${identifiers}"
"Unsupported remote database generation: ${version}": "不支持的服务器数据库版本：${version}"
"The remote database version document is invalid.": "服务器数据库的版本文档无效。"
"The remote database requires migration from generation ${version}.": "服务器数据库需要从版本 ${version} 迁移。"
