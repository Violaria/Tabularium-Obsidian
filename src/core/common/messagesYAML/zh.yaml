tabularium.settings.formatToolbarDesc: 在这台设备上，选中文字时显示与云笔记相同的格式按钮。右键的「插入」子菜单和命令面板中的命令不受影响。
tabularium.release.0.23.0: 在笔记中选中文字时浮出格式工具条，右键菜单有「插入」子菜单（表格、代码块、Mermaid 流程图、时序图、思维导图、甘特图、公式、提示块、分隔线），每一项也是命令。云笔记用同样的操作，并且可以用源码、即时渲染或分屏编辑，用渲染或源码阅读，显示 $公式$。网页里的滚动条都改为细条。
tabularium.release.0.23.1: 密码管理器（如 Bitwarden）不再在网页的普通输入框（书记员输入框、查找框、各项设置）上出现自动填充按钮；登录与修改密码的输入框照常可以自动填充。
tabularium.release.0.24.0: Tabularius 可以使用 Gemini、DeepSeek 和本机的 Ollama 作为模型提供商。每个账户可以保存多套自己的配色方案；页面浓淡均匀地作用于各层。云笔记没有打开笔记时显示欢迎页和最近修改的笔记；书记员的提案显示在回答下方；密码管理器不再干扰密码短语和密钥输入框。
tabularium.release.0.24.1: 使用深色侧栏的配色时，登录页上的名称不再看不清。
tabularium.release.0.24.2: 网页上输入的密码短语与密钥重新显示为圆点（0.24.0 和 0.24.1 显示为明文）。用部署本身的 Compose 文件恢复定时备份现在可以正常工作。
tabularium.release.0.24.3: SSH 主机中登记为禁止的主机，Tabularius 在任何档位都不会抓取指向它的网页（跳转之后也一样）。
tabularium.release.0.24.4: Tabularius 经服务器抓取网页时每次新建连接，之前抓取留下的连接不能再跳过权限档位和禁止主机的地址检查。
tabularium.release.0.24.5: 插件删除了 Tabularium 早已停用的上游功能代码（P2P 同步、引导向导、Setup URI 与二维码、隐藏文件与自定义同步），以及约一千条不再使用的词条。设置中仍开着这些功能的设备，它们保持关闭。本历史中 0.20.0 一条重新显示说明文字。
"tabularium.release.1.1.1": "登录已有笔记库时一次选定如何处理本机笔记，默认以服务器为准、保留本机独有的文件；提示与对话框的中文补全。服务器：客户端日志与提示词预览改为弹窗，登录后回到首页，撤销的设备直接删除，操作记录、失效分享、发送记录与命令记录可清理，笔记库可压缩。"
"tabularium.release.1.1.0": "设备自动命名，同一台机器的各库归为一台，重新登录替换旧凭据，断开时撤销凭据；凭据失效时启动即提示。服务器：账户设置新增「设备」页，书记员的设备不能单独撤销。"
"tabularium.release.1.0.3": "服务器：Tabularius 配方提供各提供商接口的全部参数；新增本机提供商 TensorRT-LLM。"
"tabularium.release.1.0.2": "按目录审核修改代码，使用上没有变化。"
"tabularium.release.1.0.1": "设备值改存在各笔记库自己的存储中。Release 文件由 GitHub 构建并附构建来源证明。"
"tabularium.release.1.0.0": "首个正式公开版本。代码、界面与设备数据不再使用原插件的名字；首次启动时在本机迁移数据，无需重新取回或登录。"
"tabularium.release.0.26.6": "内部结构整理，使用上没有变化；样式表和依赖按社区审核的建议更新。"
"tabularium.release.0.26.5": "从其他笔记库复制来的插件文件夹不再连接原笔记库，启动时清除连接。"
"tabularium.release.0.26.4": "文件列表的右键菜单重新有了「排序」：应用或暂停排序、在 Collation.md 中定位，以及移到所在文件夹的最前或最后（自动改写 Collation.md 中的列表）。同一文件夹的多个项目可以一起移动，先后不变。"
"tabularium.release.0.26.3": "需要 Obsidian 1.13 或更新版本。设置页改用 Obsidian 自己的样式：最上面是连接，下面是同步、文件排序、发送到 Kindle、外观、维护、帮助各一页，Obsidian 设置的搜索框能找到每一项。排序笔记改名为 Collation.md：同一文件夹中没有 Collation.md 的 sortspec.md 不再读取，在「设置 → 文件排序」预览后改名，front matter 中的规则一并转换。云笔记、分享和 Tabularius 也改用 Collation.md。"
"tabularium.release.0.26.2": "阅读模式下，sortspec.md 中「 —— 」后面的说明收进名称后的 ⓘ 图标：悬停显示，点一下在名称后展开，再点收起。云笔记中阅读 sortspec.md 也一样。"
"tabularium.release.0.26.1": "只改服务器：写在笔记库提示词里的 Tabularius 整理规则，若仍是原文，也随服务器升级改为 sortspec.md 正文列表的写法。插件没有变化。"
"tabularium.release.0.26.0": "可以暂停实时同步：笔记或文件夹右键「同步」菜单，或命令面板中的「暂停实时同步」「恢复实时同步」。暂停期间编辑留在本机，「立即同步」仍可上传。插件的本机数据改用自己的名字，可以与其他同步插件、Custom File Explorer sorting 在同一个笔记库中同时启用；更新后每台设备会从服务器取回一次笔记库，不需要重新登录。文件排序改为读取 sortspec.md 正文中的缩进列表，「 —— 」后面可以写说明；front matter 中的旧规则要在设置页「文件排序」中转换后才生效，转换之前文件列表按 Obsidian 的排序显示。"
tabularium.release.0.25.0: 插件小了约五分之一。同步核心并入 Tabularium，只保留与 Tabularium 服务器的连接，对象存储和 P2P 同步的代码已删除。设置里仍写着对象存储或 P2P 的设备不会去使用它们，照常通过 Tabularium 连接。
"tabularium.sorting.standalone": "这个笔记库启用了 Custom File Explorer sorting，文件列表由它排序，内置的文件排序不启用。停用它之后，下次加载 Tabularium 时内置排序恢复。"
