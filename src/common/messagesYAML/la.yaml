If enabled, newly created chunks are temporarily kept within the document, and graduated to become independent chunks once stabilised.: Si activum est, fragmenta nuper creata ad tempus intra documentum servantur et, cum stabilita sunt, in fragmenta independentia promoventur.
If enabled, the P2P connection will be automatically started when the application launches.: Si activum est, conexio P2P automatice incipietur cum applicatio initium capit.
If enabled, the file properties will be encrypted in the remote database. This is useful for protecting sensitive information in file paths, sizes, and IDs of its chunks. If you are using V1 E2EE, this only obfuscates the file path.: Si activum est, proprietates plicarum in repositorio remoto cryptabuntur. Hoc utile est ad informationes sensibiles in viis plicarum, magnitudinibus et ID fragmentorum protegendas. Si E2EE V1 uteris, hoc solum viam plicae obscurat.
If enabled, the file under 1kb will be processed in the UI thread.: Si activum est, plicae infra 1kb in filo UI tractabuntur.
If enabled, the forcePathStyle option will be used for bucket operations.: Si activum est, optio forcePathStyle ad operationes situlae adhibebitur.
If enabled, the notification of hidden files change will be suppressed.: Si activum est, notificatio de mutationibus plicarum occultarum supprimetur.
If enabled, the plugin will not attempt to connect to the remote database even if the chunk was not found locally.: Si activum est, additamentum ad repositorium remotum conectere non conabitur etiamsi fragmentum localiter non inventum est.
If enabled, the request API will be used to avoid `inevitable` CORS problems. This is a workaround and may not work in all cases. PLEASE READ THE DOCUMENTATION BEFORE USING THIS OPTION. This is a less-secure option.: Si activum est, API petitionum adhibebitur ad difficultates CORS `inevitable` vitandas. Hoc est remedium temporarium nec in omnibus casibus fortasse operabitur. QUAESO DOCUMENTA LEGE ANTEQUAM HAC OPTIONE UTARIS. Haec optio minus tuta est.
If enabled, the ⛔ icon will be shown inside the status instead of the file warnings banner. No details will be shown.: Si activa est, nota SKIP intra statum monstrabitur loco vexilli monitorum plicarum. Nulla singula monstrabuntur.
If this enabled, All files are handled as case-Sensitive (Previous behaviour).: Si hoc activum est, omnes plicae litterarum magnitudinem discernendo tractantur (modus prior).
If this enabled, JWT will be used for authentication.: Si hoc activum est, JWT ad authenticationem adhibebitur.
If this enabled, chunks will be split into semantically meaningful segments. Not all platforms support this feature.: Si hoc activum est, fragmenta in segmenta significatione praedita dividentur. Non omnia systemata hanc facultatem sustinent.
If this is set, changes to local files which are matched by the ignore files will be skipped. Remote changes are determined using local ignore files.: Si hoc constituitur, mutationes plicarum localium quae plicis ignorandis congruunt praetermittentur. Mutationes remotae per plicas ignorandas locales determinantur.
If this option is enabled, PouchDB will hold the connection open for 60 seconds, and if no change arrives in that time, close and reopen the socket, instead of holding it open indefinitely. Useful when a proxy limits request duration but can increase resource usage.: Si haec optio activa est, PouchDB conexionem per 60 secundas apertam tenebit et, si nulla mutatio eo tempore advenit, foramen claudet et iterum aperiet, pro eo sine fine aperto tenendo. Utile cum procurator durationem petitionum limitat, sed usum facultatum augere potest.
If you have unsynchronised changes in your Vault on this device, they will likely diverge from the server's versions after the reset. This may result in a large number of file conflicts.: Si mutationes non synchronizatas in tabulario tuo in hoc instrumento habes, post restitutionem verisimiliter a versionibus ministratoris discedent. Hoc magnum numerum discrepantiarum plicarum efficere potest.
If you understand the risks and still wish to proceed, select so.: Si pericula intellegis et tamen pergere vis, hoc elige.
