"tabularium.help.connect.title": "Coniungere et tabularium mutare"
"tabularium.help.connect.body": "Aperi Conexionem et ratione tua in ministratore Tabularium intra. Tabularium exstans elige vel novum crea, instrumento nomen da et tesseram arcanam tabularii scribe.


  Tabularium exstans primum ad hoc instrumentum arcessitur; novum ex plicis huius instrumenti impletur. Ut aliud tabularium adhibeas, 'Iterum intrare vel tabularium mutare' elige. Disiungere conexionem in hoc tantum instrumento obliviscitur.


  Tesserae instrumenti triginta dies valent et dum adhibetur sponte renovantur."
"tabularium.help.status.title": "Quid status synchronizationis significet"
"tabularium.help.status.body": "Vectigal status conexionem et numeros ostendit. 'Synchronizatum' significat nihil exspectare. 'Mutationes exspectant' numerat plicas nondum missas, quae proxima synchronizatione mittuntur.


  Sine rete mutationes servantur et postea mittuntur. Causa defectus in actis scribitur (Cura, Acta)."
"tabularium.help.passphrase.title": "Tessera arcana tabularii"
"tabularium.help.passphrase.body": "Commentarii in quoque instrumento tessera arcana tabularii ciphrantur antequam mittantur; ministrator eos legere non potest. Omnia instrumenta eiusdem tabularii eadem tessera arcana utuntur.


  Tessera arcana recuperari non potest. Si amittitur, commentarii in ministratore deciphrari non possunt; instrumenta quae plicas habent novum tabularium ex eis creare possunt."
"tabularium.help.migrate.title": "Ab additamento vetere migrare"
"tabularium.help.migrate.body": "Antequam Tabularium coniungis, \"self-hosted-livesync\" in hoc tabulario exstingue; ambo simul currere non debent. Deinde tabularium coniunge quod commentarios tuos in ministratore iam continet, ut hoc instrumentum id arcessat.


  Optiones et repositorium locale additamenti veteris non adhibentur."
"tabularium.help.rebuild.title": "Reaedificare et reserare"
"tabularium.help.rebuild.body": "Reaedificatio tabularium in ministratore plicis unius instrumenti substituit, exempli gratia ut vetera data purgentur. Dominus instrumentum in pagina interretiali permittit, deinde in eo 'Ministratorem ex hoc instrumento rescribere' in Cura agit.


  Postea tabularium clauditur. Cetera instrumenta 'Tabularium clausum' ostendunt et iterum arcessere debent. Cum omnia arcessiverint, hic vel in pagina interretiali resera."
"tabularium.help.errors.title": "Difficultates frequentes"
"tabularium.help.errors.body": "Tesserae non iam valent: instrumentum in ministratore remotum est vel tesserae exspiraverunt. Iterum intra.


  Optiones ciphrationis recusatae: optiones huius instrumenti a tabulario discrepant. Disiunge et iterum coniunge.


  Reaedificatio agitur: exspecta donec dominus eam finiat.


  Commentarius non synchronizatur: modum magnitudinis et plicas exclusas in Synchronizatione inspice, et acta lege.


  Prima synchronizatio magni tabularii tempus requirit; Obsidian apertum tene donec 'Synchronizatum' ostendatur."
"tabularium.release.0.18.0": "Nova pagina optionum ex usu disposita: conexio, synchronizatio, ordo plicarum, ad Kindle mittere, species, cura, auxilium.

  Auxilium et historia versionum tribus linguis.

  Confirmationes dicunt quid fiat et quid ceteris instrumentis significet.

  Aditus originales qui ad ministratorem Tabularium non pertinent remoti sunt: configuratio remota, URI et codices QR, introductio, synchronizatio plicarum occultarum et additamentorum, P2P."
"tabularium.release.0.17.0": "Tabularius per formulas respondet: exemplar cum parametris et praecepto ab administratore constitutum; colloquia ea aptare possunt."
"tabularium.release.0.16.0": "Optiones ministratoris, etiam epistulae ad Kindle, in pagina interretiali mutantur."
