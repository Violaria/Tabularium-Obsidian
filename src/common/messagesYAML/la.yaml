tabularium.settings.checkLinks: Nexus fractos inspicere
tabularium.settings.checkLinksDesc: Nexus enumerat qui ad nullam plicam ducunt (exempli gratia postquam commentarius in administratore plicarum aut in alio instrumento motus est), et plicas eiusdem nominis ut fines offert.
tabularium.settings.autoLinks: Nexus fractos sponte reficere
tabularium.settings.autoLinksDesc: "Tantum in hoc instrumento. Circiter 10 secundis post mutationes nexus cum una sola plica eiusdem nominis reficiuntur et in diario notantur; ceteri «Nexus fractos inspicere» exspectant. In uno instrumento plerumque currente accende: duo instrumenta eosdem commentarios reficientia confligere possunt."
tabularium.release.0.21.0: «Nexus fractos inspicere» (Cura → Nexus, aut index iussorum) nexus enumerat qui ad nullam plicam ducunt et eos plicis eiusdem nominis reficit; refectio sponte in uno instrumento accendi potest. Mutationes nominum in commentariis interretis nexus secum ferunt. Communicatio tantum ab instrumento quod eam ultimum servavit renovatur, nomina mutata sequitur et revocatur cum commentarius deletur.
tabularium.release.0.22.0: "Facies interretialis quietior et profundior: contentum ut charta iuxta latus fluitat, status punctis, actiones iconibus cum nominibus in titulis, tituli magni litteris serifatis. Colloquia Tabularii renominari, in incepta disponi et in archivum reponi possunt ex indice cuiusque colloquii. Commentarii interretis statum synchronizationis iuxta nomen arcae ostendunt et indicem plicarum condere possunt. Paginae communicatae diagrammata Mermaid pingunt; codicis segmenta circiter sexaginta linguis colorantur."
