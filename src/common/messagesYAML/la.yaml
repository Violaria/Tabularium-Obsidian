obsidianLiveSyncSettingTab.msgNotice: '---Nota---'
obsidianLiveSyncSettingTab.msgObjectStorageWarning: 'MONITUM: Haec facultas adhuc in opere est; quaeso haec memento:

  - Architectura tantum addendi. Reaedificatio necessaria est ut repositorium contrahatur.

  - Aliquantum fragilis.

  - Prima synchronizatione, tota historia ex remoto transferetur. Memento limitum datorum et celeritatis tardae.

  - Tantum differentiae continue synchronizantur.


  Si in difficultates incidis, aut ideas de hac facultate habes, quaeso quaestionem (issue) in GitHub crea.

  Tibi pro magna tua diligentia gratias ago.'
obsidianLiveSyncSettingTab.msgOriginCheck: 'Inspectio originis: ${org}'
obsidianLiveSyncSettingTab.msgRebuildRequired: 'Repositoria reaedificanda sunt ut mutationes applicentur.. Quaeso modum elige quo mutationes applicentur.


  <details>

  <summary>Legenda</summary>


  | Signum | Significatio |

  |: ------ :| ------- |

  | ⇔ | Recens |

  | ⇄ | Synchroniza ad aequandum |

  | ⇐,⇒ | Transfer ad superscribendum |

  | ⇠,⇢ | Transfer ad superscribendum ex altera parte |


  </details>


  ## ${OPTION_REBUILD_BOTH}

  Uno conspectu: Plicae ⇒¹ Repositorium locale ⇒² Remotum ⇢ⁿ Repositorium locale ⇄ⁿ⁺¹ Plicae

  Repositoria et localia et remota ex plicis exstantibus huius instrumenti reconstrue.

  Hoc alia instrumenta excludit, quae arcessere debebunt.

  ## ${OPTION_FETCH}

  Uno conspectu: Plicae ⇄² Repositorium locale ⇐¹ Remotum ⇔ Repositorium locale ⇔ Plicae

  Repositorium locale initia et ex datis a repositorio remoto arcessitis reconstrue.

  Hic casus etiam casum includit quo repositorium remotum reaedificavisti.

  ## ${OPTION_ONLY_SETTING}

  Optiones tantum serva. **Cautio: Hoc ad data corrupta ducere potest**; reconstructio repositorii plerumque necessaria est.'
