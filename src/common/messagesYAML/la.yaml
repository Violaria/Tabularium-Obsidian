P2P.Note.description: ' Hic replicator nobis permittit tabularium nostrum cum aliis instrumentis synchronizare

  per conexionem inter pares (peer-to-peer). Hoc uti possumus ut tabularium nostrum cum aliis instrumentis nostris sine servitio nubis synchronizemus.

  Hic replicator in Trystero fundatur. Etiam ministratore signorum utitur ut conexionem inter instrumenta constituat. Ministrator signorum adhibetur ut notitiae conexionis inter instrumenta commutentur. Nulla data nostra cognoscit neque servat (vel servare non debet).


  Ministratorem signorum quilibet hospitari potest. Est merus nuntius (relay) Nostr. Simplicitatis causa et ut agendi ratio replicatoris probetur, exemplar ministratoris signorum a vrtmrz hospitatur. Ministratore experimentali a vrtmrz praebito uti potes, vel quolibet alio ministratore.


  Ceterum, etsi ministrator signorum data nostra non servat, notitias conexionis quorundam instrumentorum nostrorum videre potest. Quaeso hoc animadverte. Item cave cum ministratore ab alio praebito uteris.'
