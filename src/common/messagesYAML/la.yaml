TURN relay only is available when at least one valid TURN server URL is configured under Advanced Settings.: “Solum per nuntium TURN” praesto est cum saltem unum URL ministratoris TURN validum sub optionibus provectis constitutum est.
TURN relay only requires TURN configuration. Connection path has been restored to Automatic.: “Solum per nuntium TURN” configurationem TURN requirit. Iter conexionis ad modum automaticum restitutum est.
TURN relay only requires a TURN server or a configured credential source under Advanced Settings.: “Solum per nuntium TURN” ministratorem TURN vel fontem credentialium constitutum sub optionibus provectis requirit.
TURN relay only requires at least one valid TURN server URL. Connection path has been restored to Automatic.: “Solum per nuntium TURN” saltem unum URL ministratoris TURN validum requirit. Iter conexionis ad modum automaticum restitutum est.
Testing only - Resolve file conflicts by syncing newer copies of the file, this can overwrite modified files. Be Warned.: Probationi tantum - Discrepantias plicarum solve synchronizando recentiora plicarum exemplaria; hoc plicas mutatas superscribere potest. Cave.
The API token is saved with this profile and included in Setup URI and QR code sharing. Temporary TURN credentials are kept in memory only.: Tessera API cum hac forma servatur et in communicatione Setup URI et codicis QR includitur. Testimonia TURN temporaria in memoria tantum servantur.
The Application ID for P2P connection. This should be same among your devices. It cannot be changed from the interface.: Identificatio applicationis ad conexionem P2P. Haec in omnibus instrumentis tuis eadem esse debet. In facie mutari non potest.
The Hash algorithm for chunk IDs: Algorithmus hash ad identificationes fragmentorum
The ID key is derived from the current E2EE passphrase and saved separately. Changing that passphrase later does not change the saved ID key. To reduce the risk of guessing that passphrase from known IDs, use a separate, unpredictable ID source instead.: Clavis identificationum ex tessera arcana E2EE praesenti derivatur et seorsum servatur. Si postea illam tesseram arcanam mutaveris, clavis servata non mutabitur. Ut periculum minuatur ne illa tessera arcana ex identificationibus notis divinetur, potius fontem identificationum separatum et incertum adhibe.
The ID source or recovery code is invalid. Check it and try again.: Fons identificationum aut codex recuperationis invalidus est. Inspice et iterum conare.
The Nostr relay servers to establish connections for P2P connections. Multiple servers can be separated by commas.: Ministratores Nostr relay quibus conexiones P2P constituuntur. Plures ministratores commatibus separari possunt.
The P2P connection has been configured successfully. The initial synchronisation data must now be fetched from an online source device.: Conexio P2P feliciter constituta est. Data synchronizationis initialis nunc ab instrumento fonte conexo arcessenda sunt.
The Passphrase for P2P connection. This should be same among your devices.: Tessera arcana ad conexionem P2P. Haec in omnibus instrumentis tuis eadem esse debet.
The Room ID for P2P connection. This should be same among your devices.: Identificatio conclavis ad conexionem P2P. Haec in omnibus instrumentis tuis eadem esse debet.
The Rotation duration of token in minutes. Each generated tokens will be valid only within this duration.: Spatium rotationis tesserae in minutis. Quaeque tessera generata intra hoc spatium tantum valebit.
The TURN servers to use for P2P connections. Multiple servers can be separated by commas.: Ministratores TURN ad conexiones P2P adhibendi. Plures ministratores commatibus separari possunt.
The algorithm used for JWT authentication.: Algorithmus ad authenticationem JWT adhibitus.
The credential/password for the TURN servers.: Testimonium/tessera ministratorum TURN.
The delay for consecutive on-demand fetches: Mora inter arcessiones postulatas continuas
The device information could not be loaded. Close this dialogue and open Joined devices again if the remote configuration has changed.: Notitia instrumenti onerari non potuit. Hunc dialogum claude et “Instrumenta adiuncta” iterum aperi, si configuratio remota mutata est.
The device list changed while you were trying to forget this device. Refresh the list before trying again.: Index instrumentorum mutatus est dum hoc instrumentum oblivisci conabaris. Indicem renova antequam iterum conaris.
The device record was already absent.: Tabula instrumenti iam aberat.
The device record was forgotten.: Tabula instrumenti oblita est.
The displayed recovery code belongs to the current key. Reopen this dialogue after saving to copy the replacement key.: Codex recuperationis ostensus ad clavem praesentem pertinet. Post servationem hunc dialogum iterum aperi ut clavem novam exscribas.
The file could not be opened.: Plica aperiri non potuit.
The files in this Vault are almost identical to the server's.: Plicae in hoc tabulario fere eaedem sunt atque eae ministratoris.
The follow-up report could not be prepared.: Relatio subsequens parari non potuit.
The inspected state changed. No repair was performed; run inspection again.: Status inspectus mutatus est. Nulla reparatio facta est; inspectionem iterum exsequere.
The inspection could not finish. Close this dialogue and try again after database startup.: Inspectio perfici non potuit. Hunc dialogum claude et post initium repositorii datorum iterum conare.
The key (PSK in HSxxx in base64, or private key in ESxxx in PEM) used for JWT authentication.: Clavis (PSK in HSxxx forma base64, aut clavis privata in ESxxx forma PEM) ad authenticationem JWT adhibita.
The key ID. this should be matched with CouchDB->jwt_keys->ALG:_`kid`.: Identificatio clavis. Haec cum CouchDB->jwt_keys->ALG:_`kid` congruere debet.
The local search could not finish.: Quaestio localis perfici non potuit.
The lookup does not read file contents or contact a remote database. Follow-up reports include current conflicts and merge bases.: Haec inquisitio contenta plicarum non legit neque repositorium remotum adit. Relationes subsequentes discrepantias praesentes et bases conflationis includunt.
The maximum duration for which chunks can be incubated within the document. Chunks exceeding this period will graduate to independent chunks.: Spatium maximum quo fragmenta intra documentum incubari possunt. Fragmenta quae hoc spatium excedunt in fragmenta independentia transibunt.
The maximum number of chunks that can be incubated within the document. Chunks exceeding this number will immediately graduate to independent chunks.: Numerus maximus fragmentorum quae intra documentum incubari possunt. Fragmenta quae hunc numerum excedunt statim in fragmenta independentia transibunt.
The maximum total size of chunks that can be incubated within the document. Chunks exceeding this size will immediately graduate to independent chunks.: Magnitudo maxima summa fragmentorum quae intra documentum incubari possunt. Fragmenta quae hanc magnitudinem excedunt statim in fragmenta independentia transibunt.
The minimum interval for automatic synchronisation on event.: Intervallum minimum synchronizationis automaticae ad eventum.
The project's public signalling relay is a best-effort convenience operated by the project author. It does not store Vault contents, but signalling metadata may be visible to the relay. Availability and log retention are not guaranteed. You can replace it with your own Nostr-compatible relay.: Relay signorum publicum huius incepti commoditas est ab auctore incepti pro facultate praebita. Contenta tabularii non servat, sed metadata signorum relay visibilia esse possunt. Neque praesto esse neque acta servandi ratio praestatur. Id cum relay tuo Nostr congruenti substituere potes.
The recovery code could not be copied. Select and copy the visible code instead.: Codex recuperationis exscribi non potuit. Codicem visibilem potius selige et exscribe.
The saved ID key is configured. Its source cannot be shown again.: Clavis identificationum servata configurata est. Fons eius iterum ostendi non potest.
The selected TURN configuration is not supported.: Configuratio TURN selecta non sustinetur.
The selected remote has no saved synchronisation settings. This is normal for a new remote. Use this device's settings, or cancel if you expected existing settings.: Remotum selectum nullas optiones synchronizationis servatas habet. Hoc in remoto novo solitum est. Optiones huius instrumenti adhibe, aut abroga si optiones exstantes exspectabas.
The stored document ID and recorded path are handled by different synchronisation features.: Identificatio documenti servata et via notata a diversis facultatibus synchronizationis tractantur.
The stored document ID does not match the ID derived from its recorded path.: Identificatio documenti servata non congruit cum identificatione ex via notata derivata.
The subject for JWT authentication. Mostly username.: Subiectum ad authenticationem JWT. Plerumque nomen usoris.
The username for the TURN servers.: Nomen usoris ministratorum TURN.
There is a way to resolve this on other devices.: Est modus hoc in aliis instrumentis solvendi.
There may be differences between the files in this Vault and the server.: Fortasse differentiae sunt inter plicas in hoc tabulario et ministratorem.
This Vault is empty, or contains only new files that are not on the server.: Hoc tabularium vacuum est, aut solas plicas novas continet quae in ministratore non sunt.
This device: Hoc instrumentum
This device has been locked out. Use the existing recovery process to join again.: Hoc instrumentum exclusum est. Processum recuperationis exstantem adhibe ut iterum adiungaris.
This file has ${COUNT} unresolved versions. They will be reviewed one pair at a time.: Haec plica ${COUNT} versiones non solutas habet. Singula paria deinceps recensebuntur.
This file has unresolved conflicts.: Haec plica discrepantias non solutas habet.
This is an extremely powerful operation. We strongly recommend that you copy your Vault folder to a safe location.: Haec operatio est vehementissima. Valde suademus ut thecam tabularii tui in locum tutum exscribas.
This list shows device information recorded by the remote. It does not show whether a device is online now.: Hic index notitiam instrumentorum a remoto notatam ostendit. Non ostendit num instrumentum nunc conexum sit.
"This moves one local Metadata entry to the ID derived from its recorded path.\n\n**File:** `${FILE}` \ \n**Source:** `${SOURCE}@${REVISION}` \ \n**Target:** `${TARGET}`\n\nThe target is verified before the source is removed. Its CouchDB revision ancestry cannot be preserved.\n\n> [!warning] Before repairing\n> - Back up this device.\n> - If file-name case or path obfuscation was intentionally changed for the whole database, use Rebuild instead.\n> - If other devices share this database, pause them, allow this device to upload the repair, then resume them one at a time.": "Hoc unam inscriptionem Metadata localem ad identificationem ex via notata derivatam movet.


  **Plica:** `${FILE}` \ 

  **Fons:** `${SOURCE}@${REVISION}` \ 

  **Destinatio:** `${TARGET}`


  Destinatio verificatur antequam fons removeatur. Stirps recensionum CouchDB eius servari non potest.


  > [!warning] Ante reparationem

  > - Hoc instrumentum tuto exscribe.

  > - Si litterarum magnitudo in nominibus plicarum aut obfuscatio viarum consulto pro toto repositorio mutata est, potius “Reaedifica” adhibe.

  > - Si alia instrumenta hoc repositorium communicant, ea suspende, sine hoc instrumentum reparationem sursum mittere, deinde ea singillatim resume."
This passphrase will not be copied to another device. It will be set to `Default` until you configure it again.: Haec tessera arcana in aliud instrumentum non exscribetur. Ad `Default` ponetur donec eam iterum configures.
This procedure will first delete all existing synchronisation data from the server. Following this, the server data will be completely rebuilt, using the current state of your Vault on this device (including its local database) as: Haec ratio primum omnia data synchronizationis exstantia ex ministratore delebit. Deinde data ministratoris omnino reaedificabuntur, statu praesenti tabularii tui in hoc instrumento (repositorio locali incluso) adhibito ut
This remote does not currently have a record of joined devices.: Hoc remotum nunc nullam tabulam instrumentorum adiunctorum habet.
This remote does not support conditional updates, so the device record could not be removed.: Hoc remotum renovationes condicionales non sustinet, itaque tabula instrumenti removeri non potuit.
This remote has been cleaned. Use the existing recovery process to join devices again as needed.: Hoc remotum purgatum est. Processum recuperationis exstantem adhibe ut instrumenta, prout opus est, iterum adiungas.
This remote is locked. If the device returns, use the existing recovery process to join it again.: Hoc remotum obseratum est. Si instrumentum redit, processum recuperationis exstantem adhibe ut id iterum adiungas.
This remote is locked. Use the existing recovery process for devices that need to join again.: Hoc remotum obseratum est. Processum recuperationis exstantem adhibe pro instrumentis quae iterum adiungenda sunt.
This remote is unlocked. A device that returns can register again.: Hoc remotum reseratum est. Instrumentum quod redit iterum se inscribere potest.
This removes only this device's record from the remote.: Hoc solam tabulam huius instrumenti ex remoto removet.
This report contains original paths and identifiers. Review them before sharing.: Haec relatio vias et identificationes originales continet. Eas inspice antequam communices.
This report uses pseudonyms. Review its coverage before sharing.: Haec relatio pseudonymis utitur. Ambitum eius inspice antequam communices.
This report uses temporary pseudonyms. Counts and relationships remain visible.: Haec relatio pseudonymis temporariis utitur. Numeri et relationes visibiles manent.
This uses a saved key for new Chunk IDs and obfuscated Metadata document IDs, so changing the E2EE passphrase does not derive a new key automatically.: Hoc clavem servatam ad novas identificationes fragmentorum et ad identificationes documentorum Metadata obfuscatas adhibet, itaque mutatio tesserae arcanae E2EE clavem novam sponte non derivat.
This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.: Hoc repositorium localem in hoc instrumento reaedificabit, recentissimis datis ex ministratore adhibitis. Haec actio ad incongruentias synchronizationis solvendas et ad rectam functionem restituendam destinata est.
Timestamp comparison unavailable: Comparatio temporum notatorum non praesto est
To minimise the creation of new conflicts: Ut creatio novarum discrepantiarum minuatur
