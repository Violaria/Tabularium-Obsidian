Warning! This will have a serious impact on performance. And the logs will not be synchronised under the default name. Please be careful with logs; they often contain your confidential information.: Monitum! Hoc celeritatem graviter afficiet. Et acta sub nomine praedefinito non synchronizabuntur. Cave cum actis; saepe notitiam tuam secretam continent.
"We are about to retrieve the remote data.\n\nFirstly, how shall we handle the data retrieved from this remote source?\n\n- **${NEWER_WINS}**: Compares the modified time of files and takes the newer one.\n  If you have been using Self-hosted LiveSync and have made changes on multiple devices, this option may be suitable for you as it tries to merge changes based on modified time.\n- **${REMOTE_WINS}**: Remote data is the source of truth.\n  If you are new to using Self-hosted LiveSync. This option may be easiest to understand and get started with.\n  It will overwrite all your local files with the remote data, so please make sure you have a backup if there is any important data in your vault.\n- **${DETAILED}**: Opens the detailed setup wizard.\n  If you want to have more control over the synchronisation process, or want to review the changes before applying, you can choose this option to use the detailed flow.": "Data remota mox recipiemus.


  Primum, quomodo data ex hoc fonte remoto recepta tractabimus?


  - **${NEWER_WINS}**: Tempora mutationis plicarum comparat et recentiorem sumit.

  \  Si Tabularium iam adhibuisti et in pluribus instrumentis mutationes fecisti, haec optio tibi fortasse apta est, quia mutationes secundum tempus mutationis conflare conatur.

  - **${REMOTE_WINS}**: Data remota fons veritatis sunt.

  \  Si Tabularium primum adhibes, haec optio fortasse facillima est ad intellegendum et incipiendum.

  \  Omnes plicas tuas locales datis remotis superscribet, itaque cura ut exemplar tutum habeas si qua data magni momenti in tabulario tuo sunt.

  - **${DETAILED}**: Ductorem institutionis accuratum aperit.

  \  Si processum synchronizationis magis regere vis, aut mutationes ante applicationem recensere vis, hanc optionem eligere potes ut processum accuratum adhibeas."
We recommend that you copy your Vault folder to a safe location. This will provide a safeguard in case a large number of conflicts arise, or if you accidentally synchronise with an incorrect destination.: Suademus ut thecam tabularii tui in locum tutum exscribas. Hoc praesidium praebebit si multae discrepantiae oriuntur, aut si per errorem cum destinatione falsa synchronizas.
WebRTC encrypts data between your devices, including when it passes through TURN. The TURN provider cannot read the transferred data. It can see network addresses and traffic volume.: WebRTC data inter instrumenta tua cryptat, etiam cum per TURN transeunt. Praebitor TURN data translata legere non potest. Inscriptiones retiales et copiam commeatus videre potest.
When enabled, this device notifies connected peers after a local change. The notification contains no Vault data; a peer which follows this device then fetches the change through the encrypted P2P connection.: Si activa est, hoc instrumentum pares conexos post mutationem localem certiores facit. Nuntius nulla data tabularii continet; par qui hoc instrumentum sequitur deinde mutationem per conexionem P2P cryptatam arcessit.
When you save a file in the editor, start a sync automatically: Cum plicam in editore servas, synchronizationem automatice incipe
While enabled, it causes very performance impact but debugging replication testing and other features will be enabled. Please disable this if you have not read the source code. Requires restart of Obsidian. Sometimes there is no implementation.: Dum activa est, effectum multum minuit, sed probatio replicationis ad vitia investiganda aliaeque facultates activantur. Deactiva hanc optionem, nisi codicem fontis legisti. Obsidian iterum incipiendum est. Interdum nulla exsecutio adest.
Winner revision: Recensio victrix
Within the two-second comparison window: Intra spatium comparationis duorum secundorum
Write credentials in the file: Inscribe testimonia in plicam
Write logs into the file: Inscribe acta in plicam
You can enable this setting to process the files with size mismatches, these files can be created by some APIs or integrations.: Hanc optionem activare potes ut plicae cum magnitudinibus discrepantibus tractentur; tales plicae ab aliquibus API vel integrationibus creari possunt.
You should create a new synchronisation destination and rebuild your data there.: Novam destinationem synchronizationis creare et data tua ibi reaedificare debes.
You should perform this operation only in exceptional circumstances, such as when the server data is completely corrupted, when changes on all other devices are no longer needed, or when the database size has become unusually large in comparison to the Vault size.: Hanc operationem tantum in condicionibus extraordinariis perficere debes, ut cum data ministratoris omnino corrupta sunt, cum mutationes in omnibus aliis instrumentis non iam necessariae sunt, aut cum magnitudo repositorii prae magnitudine tabularii insolite magna facta est.
by resetting the remote, you will be informed on other devices.: remoto restituendo, in aliis instrumentis certior fies.
