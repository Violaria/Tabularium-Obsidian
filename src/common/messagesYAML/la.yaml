tabularium.settings.formatToolbarDesc: In hoc instrumento, textu selecto, eadem instrumenta formae ac in commentariis interretis ostendit. Submenu «Insere» (dextro clic) et iussa manent.
tabularium.release.0.23.0: Textu in commentario selecto instrumenta formae apparent, et dextro clic submenu «Insere» praebet (tabulas, segmenta codicis, diagrammata Mermaid fluxus, seriei, mappas mentis, Gantt, formulas, monita, lineas divisorias); singula etiam iussa sunt. Commentarii interretis eisdem actionibus utuntur, et nunc in fonte, redditione viva aut conspectu diviso scribuntur, redditi aut ut fons leguntur, et $formulas$ pingunt. Virgae volvendi in paginis interretis tenues sunt.
tabularium.release.0.23.1: Custodes tesserarum (ut Bitwarden) iam non in campis communibus paginarum interretis (capsa nuntii Tabularii, quaestiones, optiones) bullam suam implendi ponunt; campi ingressus et tesserae ut antea cum eis operantur.
tabularium.release.0.24.0: Tabularius Gemini, DeepSeek et Ollama localem ut praebitores exemplarium adhibere potest. Quisque usus plures rationes colorum suas servare potest; tinctura paginae omnes gradus aequaliter colorat. Commentarii interretis, nullo aperto, salutant et commentarios nuper mutatos ostendunt; propositiones scribae sub responso apparent; custodes tesserarum sententias arcanas et claves relinquunt.
