  Tres optiones habemus:


  - %{Replicator.Dialogue.Locked.Action.Fetch}

  \  Modus maxime praeferendus et fidissimus. Hoc repositorium locale semel abiciet et omnes notitias synchronizationis ex repositorio remoto denuo restituet. Plerumque hoc tuto facere possumus. Tamen aliquantum temporis requirit et in rete stabili faciendum est.

  - %{Replicator.Dialogue.Locked.Action.Unlock}

  \  Hic modus adhiberi potest tantum si iam per alios modos replicationis certo synchronizati sumus. Hoc non solum significat nos easdem plicas habere. Si incertus es, eum vitare debes.

  - %{Replicator.Dialogue.Locked.Action.Dismiss}

  \    Hoc operationem abrogabit. Et proxima petitione iterum rogabimur.\n"
