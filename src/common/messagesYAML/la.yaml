Synchronisation between different plug-in versions is generally safe unless the connection is explicitly blocked. However, it may be less efficient or use more storage, and P2P synchronisation may be unavailable.: Synchronizatio inter diversas versiones additamenti plerumque tuta est, nisi conexio expresse impeditur. Fortasse tamen minus efficax erit vel plus spatii adhibebit, et synchronizatio P2P fortasse non praesto erit.
