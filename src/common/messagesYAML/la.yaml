Obsidian will be restarted soon! (Within ${stableCheck} seconds): Obsidian intra ${stableCheck} secunda denuo incipiet.
The selected revision does not have a revision identifier.: Revisio selecta identificatore revisionis caret.
Restoring the selected revision failed before Vault reflection completed. Review the file with 'Inspect conflicts and file/database differences' before retrying.: Restitutio revisionis selectae defecit antequam in tabularium scriberetur. Plicam inspice antequam iterum conaris.
The selected revision could not be restored because its content is no longer available.: Revisio selecta restitui non potuit, quia eius contentum iam non exstat.
The current database revision could not be read. The Vault was not changed.: Revisio praesens in repositorio legi non potuit. Tabularium non mutatum est.
Only an ordinary valid Vault path can be restored from Document History.: Ex Historia documenti restitui potest sola via ordinaria et valida in tabulario.
The restored revision could not be created. The file may have changed during the operation, and the Vault was not changed.: Revisio restituta creari non potuit. Plica fortasse dum res agebatur mutata est. Tabularium non mutatum est.
The restored revision was saved in the local database, but it could not be reflected to the Vault. Use 'Inspect conflicts and file/database differences' to review and apply it.: Revisio restituta in repositorio huius instrumenti servata est, sed in tabularium scribi non potuit.
The selected content was restored as a new revision. Other versions remain unresolved; use 'Inspect conflicts and file/database differences' to review them.: Contentum selectum ut nova revisio restitutum est. Aliae versiones adhuc irresolutae manent; per 'Elige plicam ad discrepantiam solvendam' eas inspice.
The selected content was restored as a new revision.: Contentum selectum ut nova revisio restitutum est.
The selected content was restored as a new revision. LiveSync could not confirm whether other versions remain; use 'Inspect conflicts and file/database differences' to review the file.: Contentum selectum ut nova revisio restitutum est. Tabularium confirmare non potuit an aliae versiones supersint; per 'Elige plicam ad discrepantiam solvendam' plicam inspice.
The restored file could not be opened in the editor.: Plica restituta in editore aperiri non potuit.
