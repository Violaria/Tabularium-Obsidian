moduleMigration.insecureChunkExist.message: 'Aliqua fragmenta non tuto servata nec in repositoriis cryptata sunt.

  **Quaeso repositorium reaedifica ut hanc rem corrigas**.


  Si repositorium remotum tuum sine SSL configuratum est, vel testimoniis minus tutis utitur, **periculum est ne data sensibilia patefiant**.


