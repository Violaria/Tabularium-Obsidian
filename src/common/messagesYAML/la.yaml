Enabling end-to-end encryption ensures that your data is encrypted on your device before being sent to the remote server. This means that even if someone gains access to the server, they won't be able to read your data without the passphrase. Make sure to remember your passphrase, as it will be required to decrypt your data on other devices.: Cryptatio ab extremo ad extremum efficit ut data tua in instrumento tuo cryptentur antequam ad ministratorem remotum mittantur. Itaque etiamsi quis accessum ad ministratorem adipiscatur, data tua sine tessera arcana legere non poterit. Cura ut tesseram arcanam memineris, nam ad data tua in aliis instrumentis decryptanda requiretur.
Encrypt contents on the remote database. If you use the plugin's synchronization feature, enabling this is recommended.: Contenta in repositorio remoto crypta. Si facultate synchronizationis additamenti uteris, hoc activare commendatur.
Encrypt file properties (paths, times, sizes, and Chunk references) used by Hidden File Sync and Customisation Sync. This affects future writes; manually rebuild the remote database to protect existing properties. Requires E2EE V2, Property Encryption, and compatible clients on every device.: Proprietates plicarum (vias, tempora, magnitudines et relationes ad fragmenta) crypta quibus synchronizatio plicarum occultarum et synchronizatio optionum propriarum utuntur. Hoc ad scripturas futuras pertinet; repositorium remotum manu reaedifica ut proprietates exstantes protegas. Requirit E2EE V2, cryptationem proprietatum et clientes compatibiles in omni instrumento.
