TweakMismatchResolve.Message.AutoAcceptCompatibleUndefined: '

  Optiones in singulis instrumentis differre videntur. Nunc mutationes congruentes his configurationibus automatice applicare potes.

  Visne hanc optionem `auto-accept` activare?'
TweakMismatchResolve.Message.Main: '

  Optiones in repositorio remoto sunt hae. Hi valores ab aliis instrumentis configurati sunt, quae cum hoc instrumento saltem semel synchronizata sunt.


  Si has optiones adhibere vis, selige %{TweakMismatchResolve.Action.UseConfigured}.

  Si optiones huius instrumenti servare vis, selige %{TweakMismatchResolve.Action.Dismiss}.


  ${table}


  >[!TIP]

  > Si omnes optiones synchronizare vis, post configurationem minimam hac facultate applicatam `Sync settings via markdown` adhibe.


  ${additionalMessage}'
TweakMismatchResolve.Message.MainTweakResolving: 'Configuratio tua cum ea in ministratore remoto non congruit.


  Configuratio sequens congruere debet:


  ${table}


  Nobis consilium tuum indica.


  ${additionalMessage}'
TweakMismatchResolve.Message.UseRemote.WarningRebuildRecommended: '

  >[!NOTICE]

  > Quaedam mutationes congruunt sed fortasse plus spatii et transmissionis consument. Reaedificatio commendatur. Reaedificatio tamen nunc fieri non debet, sed in futura curatione fieri potest.

  > ***Cura ut tempus habeas et retiaculo stabili conexus sis antequam applices!***'
TweakMismatchResolve.Message.UseRemote.WarningRebuildRequired: '

  >[!WARNING]

  > Quaedam configurationes remotae cum repositorio locali huius instrumenti non congruunt. Repositorium locale reaedificandum erit.

  > ***Cura ut tempus habeas et retiaculo stabili conexus sis antequam applices!***'
TweakMismatchResolve.Message.WarningIncompatibleRebuildRecommended: '

  >[!NOTICE]

  > Animadvertimus quosdam valores differre, ita ut repositorium locale cum remoto non congruat.

  > Quaedam mutationes congruunt sed fortasse plus spatii et transmissionis consument. Reaedificatio commendatur. Reaedificatio tamen nunc fieri non debet, sed in futura curatione fieri potest.

  > Si reaedificare vis, pauca minuta aut plura requiruntur. **Cura ut nunc id tuto fieri possit.**'
TweakMismatchResolve.Message.WarningIncompatibleRebuildRequired: '

  >[!WARNING]

  > Animadvertimus quosdam valores differre, ita ut repositorium locale cum remoto non congruat.

  > Aut localis aut remota reaedificatio requiritur. Utraque pauca minuta aut plura requirit. **Cura ut nunc id tuto fieri possit.**'
