RedFlag.Fetch.Method.Desc: "Quomodo arcessere vis?

  - %{RedFlag.Fetch.Method.FetchSafer}.

  \  **Commeatus parvus**, **CPU magnus**, **Periculum parvum**

  \  Commendatur si ...

  \  - Plicae fortasse inconstantes sunt

  \  - Plicae non tam multae erant

  - %{RedFlag.Fetch.Method.FetchSmoother}.

  \  **Commeatus parvus**, **CPU modicus**, **Periculum parvum vel modicum**

  \  Commendatur si ...

  \  - Plicae probabiliter constantes sunt

  \  - Plurimas plicas habes.

  - %{RedFlag.Fetch.Method.FetchTraditional}.

  \  **Commeatus magnus**, **CPU parvus**, **Periculum parvum vel modicum**


  >[!INFO]- Singula

  > ## %{RedFlag.Fetch.Method.FetchSafer}.

  > **Commeatus parvus**, **CPU magnus**, **Periculum parvum**

  > Haec optio primum repositorium locale ex plicis localibus exstantibus creat antequam data ex fonte remoto arcessit.

  > Si plicae congruentes et localiter et remote exstant, solae differentiae inter eas transferentur.

  > Plicae tamen in utroque loco praesentes primo ut plicae discrepantes tractabuntur. Automatice solventur si re vera non discrepant, sed hic processus tempus requirere potest.

  > Hic plerumque modus tutissimus est, periculum datorum amittendorum minimum reddens.

  > ## %{RedFlag.Fetch.Method.FetchSmoother}.

  > **Commeatus parvus**, **CPU modicus**, **Periculum parvum vel modicum** (pro operatione)

  > Haec optio primum fragmenta ex plicis localibus pro repositorio creat, deinde data arcessit. Itaque sola fragmenta quae localiter desunt transferuntur. Omnia tamen metadata ex fonte remoto sumuntur.

  > Plicae locales deinde in initio cum his metadatis comparantur. Contentum quod recentius habetur vetustius superscribet (secundum tempus mutationis). Hic exitus deinde ad repositorium remotum rursus synchronizatur.

  > Hoc plerumque tutum est si plicae locales re vera notam temporis recentissimam habent. Difficultates tamen afferre potest si plica notam temporis recentiorem sed contentum vetustius habet (ut `welcome.md` initialis).

  > Hoc minus CPU adhibet et celerius est quam “%{RedFlag.Fetch.Method.FetchSafer}”, sed ad data amittenda ducere potest nisi caute adhibetur.

  > ## %{RedFlag.Fetch.Method.FetchTraditional}.

  > **Commeatus magnus**, **CPU parvus**, **Periculum parvum vel modicum** (pro operatione)

  > Omnia ex remoto arcessentur.

  > Simile %{RedFlag.Fetch.Method.FetchSmoother}, sed omnia fragmenta ex fonte remoto arcessuntur.

  > Hic est modus arcessendi maxime traditus, qui plerumque plurimum commeatus retis et temporis consumit. Simile quoque periculum plicarum remotarum superscribendarum habet atque optio '%{RedFlag.Fetch.Method.FetchSmoother}'.

  > Saepe tamen modus stabilissimus habetur, quia diutissime constitutus et simplicissimus est."
