Failed to reset KeyValueDB: Repositorium clavium et valorum restitui non potuit
Failed to open KeyValueDB: Repositorium clavium et valorum aperiri non potuit
"The request may have failed. The reason sent by the server: ${r.status}: ${r.statusText}": "Petitio fortasse defecit. Responsum ministratoris: ${r.status}: ${r.statusText}"
The request was successful by API. But the native fetch API failed! Please check CORS settings on the remote database!. While this condition, you cannot enable LiveSync: Petitio per API Obsidian successit, sed API fetch nativum defecit. Optiones CORS ministratoris inspice. Donec hoc corrigatur, synchronizatio continua activari non potest.
"Failed to fetch by API. ${resp2.status}: ${msg}": "Petitio defecit. ${resp2.status}: ${msg}"
