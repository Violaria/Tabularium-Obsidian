Failed to encrypt remote configuration '${id}'. This entry will be saved in plain text.: Configuratio ministratoris “${id}” cryptari non potuit. Haec inscriptio textu aperto servabitur.
Remote configuration '${id}' had a plain-text URI marked as encrypted. The flag has been repaired.: Configuratio ministratoris “${id}” URI textus aperti ut cryptatum notatum habebat. Nota correcta est.
Failed to decrypt remote configuration '${id}'. Verify passphrase and configuration.: Configuratio ministratoris “${id}” decryptari non potuit. Tesseram arcanam et configurationem inspice.
"Error in update function: ": Erratum in optionibus renovandis
