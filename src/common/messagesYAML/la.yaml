Preserved unsynchronised local changes as a conflict for ${path}: Mutationes plicae ${path} in hoc instrumento nondum synchronizatae ut discrepantia servatae sunt
Database kept changing while reflecting ${path}: Dum ${path} in tabularium scribitur, repositorium mutari non desiit
"Preserved ${path}: the rename target no longer resolves to ${targetPath}": "${path} servatus est: nomen novum iam ad ${targetPath} non spectat"
"Preserved ${path}: rename target ${targetPath} is still selected": "${path} servatus est: nomen novum ${targetPath} adhuc electum est"
"Preserved ${path}: a current storage item contradicts its deletion event": "${path} servatus est: res praesens in tabulario eventui deletionis repugnat"
Could not validate deletion of ${path}; preserved the database entry: Deletio plicae ${path} confirmari non potuit; inscriptio in repositorio servata est
Could not validate the saved storage operation for ${path} against current storage; the operation remains pending for recovery: Operatio servata plicae ${path} cum statu praesenti tabularii comparari non potuit; ad restitutionem pendet
Unload preparation failed; pending storage work may require recovery: Praeparatio ad exonerandum defecit; operationes plicarum pendentes fortasse restituendae sunt
