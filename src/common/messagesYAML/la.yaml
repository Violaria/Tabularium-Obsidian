tabularium.settings.formatToolbarDesc: In hoc instrumento, textu selecto, eadem instrumenta formae ac in commentariis interretis ostendit. Submenu «Insere» (dextro clic) et iussa manent.
tabularium.release.0.23.0: Textu in commentario selecto instrumenta formae apparent, et dextro clic submenu «Insere» praebet (tabulas, segmenta codicis, diagrammata Mermaid fluxus, seriei, mappas mentis, Gantt, formulas, monita, lineas divisorias); singula etiam iussa sunt. Commentarii interretis eisdem actionibus utuntur, et nunc in fonte, redditione viva aut conspectu diviso scribuntur, redditi aut ut fons leguntur, et $formulas$ pingunt. Virgae volvendi in paginis interretis tenues sunt.
tabularium.release.0.23.1: Custodes tesserarum (ut Bitwarden) iam non in campis communibus paginarum interretis (capsa nuntii Tabularii, quaestiones, optiones) bullam suam implendi ponunt; campi ingressus et tesserae ut antea cum eis operantur.
tabularium.release.0.24.0: Tabularius Gemini, DeepSeek et Ollama localem ut praebitores exemplarium adhibere potest. Quisque usus plures rationes colorum suas servare potest; tinctura paginae omnes gradus aequaliter colorat. Commentarii interretis, nullo aperto, salutant et commentarios nuper mutatos ostendunt; propositiones scribae sub responso apparent; custodes tesserarum sententias arcanas et claves relinquunt.
tabularium.release.0.24.1: Nomen in pagina ingressus legi potest cum ratione lateris obscuri.
tabularium.release.0.24.2: Sententiae arcanae et claves in paginis interretis rursus ut puncta apparent (0.24.0 et 0.24.1 eas ut textum ostendebant). Restitutio exemplorum statutorum cum ipsis Compose deploymentis plicis nunc operatur.
tabularium.release.0.24.3: Tabularius paginam ab hospite inter hospites SSH ut vetito inscripto numquam petit, in nullo gradu potestatis, ne post redirectionem quidem.
tabularium.release.0.24.4: Quaeque pagina quam Tabularius per ministratorem petit suum nexum aperit, ne nexus a priore petitione relictus examen inscriptionis gradus potestatis aut hospitum vetitorum praetereat.
tabularium.release.0.24.5: Codex functionum superiorum quae Tabularium iam exstinxerat (synchronizatio inter pares, ductor instituendi, Setup URI et codices QR, synchronizatio fasciculorum occultorum et accommodationum) ex additamento tollitur, una cum mille fere nuntiis non adhibitis. Instrumentum cuius optiones has functiones adhuc accendunt eas exstinctas servat. Pars 0.20.0 huius historiae textum suum iterum ostendit.
"tabularium.release.0.26.3": "Obsidian 1.13 vel recentior requiritur. Pagina optionum more ipsius Obsidian disponitur: primum conexio, deinde singulae paginae synchronizationis, ordinis plicarum, missionis ad Kindle, speciei, curae et auxilii; capsa quaerendi optionum Obsidian quamque optionem invenit. Nota ordinis nunc Collation.md appellatur: sortspec.md sine Collation.md iuxta posito non iam legitur, et in Optionibus → Ordo plicarum post praevisionem renominatur, regulis in front matter conversis. Commentarii interretiales, communicationes et Tabularius quoque Collation.md adhibent."
"tabularium.release.0.26.2": "In modo legendi, notae post « —— » in sortspec.md post quodque nomen in signum ⓘ conduntur: cursore superposito leguntur, tactu post nomen aperiuntur et iterum tactu clauduntur. Commentarii interretiales sortspec.md eodem modo ostendunt."
"tabularium.release.0.26.1": "Solum ministrator: regulae ordinandi Tabularii in praecepto tabularii proprio scriptae, si adhuc ut primum scriptae sunt, renovato ministratore quoque ad indicem in sortspec.md mutantur. Additamentum non mutatur."
"tabularium.release.0.26.0": "Synchronizationem vivam suspendere potes: «Synchronizationem vivam suspende» et «Synchronizationem vivam resume» in indice «Synchronizatio» commentarii aut capsae, vel in tabula mandatorum. Dum suspensa est, mutationes in hoc instrumento manent et «Synchroniza nunc» eas adhuc mittit. Additamentum nunc data sua localia sub nominibus propriis servat, itaque in eodem tabulario cum aliis additamentis synchronizationis et cum Custom File Explorer sorting accendi potest; post renovationem quodque instrumentum tabularium suum semel a ministratore arcessit, sine nova inscriptione. Ordo plicarum nunc indicem gradatum in corpore sortspec.md legit, notis post « —— » scriptis; regulae in front matter tum demum valent cum in Optiones → Ordo plicarum convertuntur, et interea index plicarum ordinem Obsidian servat."
tabularium.release.0.25.0: Additamentum fere quinta parte minus est. Nucleus synchronizationis nunc pars Tabularii est et solum nexum cum ministratore Tabularii servat; codex repositorii obiectorum et synchronizationis inter pares sublatus est. Instrumentum cuius optiones adhuc repositorium obiectorum aut synchronizationem inter pares nominant eis non utitur et per Tabularium ut solet conectit.
"tabularium.sorting.standalone": "In hoc tabulario Custom File Explorer sorting adhibetur et indicem plicarum ordinat, itaque ordinatio interna non adhibetur. Si id deactivas, ordinatio interna proximo Tabularii initio redit."
