moduleMigration.msgFetchRemoteAgain: 'Ut fortasse iam scis, Tabularium modum praedefinitum et structuram repositorii mutavit.


  Et feliciter, tempore et labore tuo, repositorium remotum iam migratum esse videtur. Gratulamur!


  Attamen paulo plus opus est. Configuratio huius instrumenti cum repositorio remoto non congruit. Repositorium remotum iterum arcessere necesse erit. Arcessamusne nunc iterum ex remoto?


  ___Nota: Synchronizare non possumus donec configuratio mutata et repositorium iterum arcessitum sit.___

  ___Nota 2: Fragmenta omnino immutabilia sunt; tantum metadata et differentiam arcessere possumus.___'
moduleMigration.msgSinceV02321: "Ab v0.23.21, Tabularium modum praedefinitum et structuram repositorii mutavit. Hae mutationes factae sunt:


  1. **Discrimen litterarum maiuscularum in nominibus plicarum**

  \   Tractatio nominum plicarum nunc litteras maiusculas et minusculas non discernit. Haec mutatio plerisque suggestibus utilis est, praeter Linux et iOS, quae discrimen litterarum in nominibus plicarum non bene administrant.

  \   (In his, monitum monstrabitur pro plicis eodem nomine sed diversis litteris).


  2. **Tractatio recensionum fragmentorum**

  \   Fragmenta immutabilia sunt, quod sinit recensiones eorum figi. Haec mutatio celeritatem servandi plicas augebit.


  ___Attamen, ut utramvis harum mutationum actives, repositoria et remotum et locale reaedificanda sunt. Hic processus paucas minutas postulat, et suademus ut id facias cum satis temporis habes.___


  - Si modum priorem retinere vis, hunc processum per `${KEEP}` omittere potes.

  - Si satis temporis non habes, quaeso elige `${DISMISS}`. Postea iterum rogaberis.

  - Si repositorium in alio instrumento reaedificavisti, quaeso elige `${DISMISS}` et iterum synchronizare conare. Quia differentia detecta est, iterum rogaberis."
