"Refusing to apply a filename case change across differently cased parent directories: ${existDoc.path} -> ${path}": "Mutatio litterarum maiuscularum vel minuscularum in nomine plicae non applicatur, quia capsae parentes litteris diversis scriptae sunt: ${existDoc.path} -> ${path}"
"Could not apply the stored filename case: ${existDoc.path} -> ${path}": "Forma litterarum nominis plicae servata applicari non potuit: ${existDoc.path} -> ${path}"
File ${path} seems to be corrupted! Writing prevented. (${docRead.size} != ${reflectedContent.size}): Plica ${path} corrupta esse videtur; scriptura prohibita est (${docRead.size} != ${reflectedContent.size})
