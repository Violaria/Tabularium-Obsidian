"Since you have chosen to overwrite all local files with remote data, **how would you like to handle local files that are not present in the remote database?**\n\n- **${DELETE_ALL}**: Local-only files and remote-deleted files will be removed.\n  This option will make your local vault exactly the same as the remote database, but please make sure you have a backup if there is any important data in your vault.\n- **${DELETE_NONE}**: All existing local files will be preserved.\n  This option will keep all your local files, but it may cause duplicates if there are files that exist on local but not on remote. You can clean up these duplicates manually after the synchronisation.": "Quoniam omnes plicas locales datis remotis superscribere elegisti, **quomodo plicas locales tractare vis quae in repositorio remoto non adsunt?**


  - **${DELETE_ALL}**: plicae solum locales et plicae remote deletae removebuntur.

  \  Haec optio tabularium tuum locale prorsus idem ac repositorium remotum reddet, sed quaeso cura ut exemplar tutelae habeas si qua data gravia in tabulario tuo sunt.

  - **${DELETE_NONE}**: omnes plicae locales exstantes servabuntur.

  \  Haec optio omnes plicas tuas locales servabit, sed duplicata efficere potest si plicae localiter sed non remote exstant. Haec duplicata post synchronizationem manu purgare potes."
Skips checking and applying synchronisation settings from the remote.: Praetermittit inspectionem et applicationem optionum synchronizationis ex remoto.
Smaller messages can improve compatibility on paths which fragment or drop larger WebRTC messages. This setting limits outgoing P2P messages, so use a compatible profile on each sending device when required.: Nuntii minores compatibilitatem augere possunt in itineribus quae nuntios WebRTC maiores frangunt vel abiciunt. Haec optio nuntios P2P exeuntes limitat; ergo, ubi opus est, rationem compatibilem in quoque instrumento mittente adhibe.
Some files failed to synchronise. What would you like to do?: Quaedam plicae synchronizari non potuerunt. Quid facere vis?
