"How should files that were deleted on other devices be handled?\n\n- **${NEWER_CLEANUP}**: Delete local files if they were deleted on remote.\n  This is useful if you want to keep your vault clean and consistent across devices, but please make sure you have a backup if there is already any important data in your vault.\n- **${NEWER_SYNC_ALL}**: Recreate remote files even if they were deleted on remote.\n  This option will keep all your local files, but it may cause duplicates if there are files that exist on local but not on remote. You can clean up these duplicates manually after the synchronisation.": "Quomodo tractandae sunt plicae quae in aliis instrumentis deletae sunt?


  - **${NEWER_CLEANUP}**: Dele plicas locales si in remoto deletae sunt.

  \  Hoc utile est si tabularium tuum mundum et constans per instrumenta servare vis, sed cura ut exemplar tutelare habeas si iam data magni momenti in tabulario tuo sunt.

  - **${NEWER_SYNC_ALL}**: Plicas remotas recrea etiamsi in remoto deletae sunt.

  \  Haec optio omnes plicas tuas locales servabit, sed duplicata efficere potest si plicae localiter sed non remote exstant. Haec duplicata post synchronizationem manu purgare potes."
