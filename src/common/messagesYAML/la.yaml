"Error in applying partial settings: ": Erratum in optionibus partialibus applicandis
Failed to decrypt configuration item: Res configurationis decryptari non potuit
Failed to obtain passphrase when saving data.json! Please verify the configuration.: Dum data.json servatur, tessera arcana obtineri non potuit. Configurationem inspice.
No passphrase found for data.json! Verify configuration before syncing.: Nulla tessera arcana pro data.json inventa est. Ante synchronizationem configurationem inspice.
Encrypted remote configurations found, but passphrase is unavailable. Verify configuration before syncing.: Configurationes ministratoris cryptatae inventae sunt, sed tessera arcana praesto non est. Ante synchronizationem configurationem inspice.
Failed to decrypt passphrase from data.json! Ensure configuration is correct before syncing with remote.: Tessera arcana ex data.json decryptari non potuit. Ante synchronizationem cum ministratore fac ut configuratio recta sit.
"Failed to activate the selected remote configuration: ${activeConfigurationId}": "Configuratio ministratoris electa activari non potuit: ${activeConfigurationId}"
"Failed to activate the selected P2P remote configuration: ${p2pActiveConfigurationId}": "Configuratio inter pares electa activari non potuit: ${p2pActiveConfigurationId}"
Configuration issues detected and automatically resolved. However, unsynchronized data may exist. Consider rebuilding if necessary.: Vitia configurationis inventa et sponte correcta sunt. Fortasse tamen data nondum synchronizata exstant; si opus est, reaedifica.
Device name missing. Disabling plug-in sync.: Nomen instrumenti deest. Synchronizatio additamentorum deactivata est.
The remote database has been cleaned.: Repositorium ministratoris purgatum est.
The local database has been cleaned up.: Repositorium huius instrumenti purgatum est.
Replication has been cancelled. Please try it again.: Synchronizatio abrogata est. Iterum conare.
Replication activated: Synchronizatio incepit
Replication completed: Synchronizatio perfecta
Replication stopped for busy.: Synchronizatio suspensa est, quia ministrator occupatus est.
Replication stopped.: Synchronizatio cessavit.
