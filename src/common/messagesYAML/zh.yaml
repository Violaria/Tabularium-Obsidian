If enabled, changes will be automatically broadcasted to all connected peers. Notified peers will start fetching the changes.: 启用后，变更将自动广播给所有已连接的对等方。收到通知的对等方会开始获取这些变更。
If enabled, efficient per-file customization sync will be used. A minor migration is required when enabling this feature, and all devices must be updated to v0.23.18. Enabling this feature will result in losing compatibility with older versions.: 启用后，将使用高效的按文件自定义同步。启用此功能需要进行一次小规模迁移，并且所有设备都必须更新到 v0.23.18。启用此功能将失去与旧版本的兼容性。
If enabled, the P2P connection will be automatically started when the application launches.: 启用后，应用启动时将自动开始 P2P 连接。
If enabled, the file properties will be encrypted in the remote database. This is useful for protecting sensitive information in file paths, sizes, and IDs of its chunks. If you are using V1 E2EE, this only obfuscates the file path.: 启用后，文件属性将在远程数据库中加密。这有助于保护文件路径、大小及其块 ID 中的敏感信息。如果使用 V1 E2EE，则只会混淆文件路径。
If enabled, the forcePathStyle option will be used for bucket operations.: 启用后，存储桶操作将使用 forcePathStyle 选项。
If enabled, the plugin will not attempt to connect to the remote database even if the chunk was not found locally.: 启用后，即使本地找不到块，插件也不会尝试连接远程数据库。
If enabled, the request API will be used to avoid `inevitable` CORS problems. This is a workaround and may not work in all cases. PLEASE READ THE DOCUMENTATION BEFORE USING THIS OPTION. This is a less-secure option.: 启用后，将使用 request API 来规避`无法避免的`CORS 问题。这是一种变通方法，未必在所有情况下都有效。使用此选项前请务必阅读文档。此选项的安全性较低。
If this enabled, JWT will be used for authentication.: 启用后，将使用 JWT 进行认证。
