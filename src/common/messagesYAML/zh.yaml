"How should files that were deleted on other devices be handled?\n\n- **${NEWER_CLEANUP}**: Delete local files if they were deleted on remote.\n  This is useful if you want to keep your vault clean and consistent across devices, but please make sure you have a backup if there is already any important data in your vault.\n- **${NEWER_SYNC_ALL}**: Recreate remote files even if they were deleted on remote.\n  This option will keep all your local files, but it may cause duplicates if there are files that exist on local but not on remote. You can clean up these duplicates manually after the synchronisation.": "应如何处理在其他设备上已删除的文件？


  - **${NEWER_CLEANUP}**：如果文件在远程已删除，则删除本地文件。

  \  如果你希望笔记库在各设备之间保持整洁一致，此选项很有用；但如果笔记库中已有重要数据，请确保已做好备份。

  - **${NEWER_SYNC_ALL}**：即使文件在远程已删除，也重新创建远程文件。

  \  此选项会保留所有本地文件，但如果有文件只存在于本地而不在远程，可能会产生重复。同步完成后可以手动清理这些重复文件。"
