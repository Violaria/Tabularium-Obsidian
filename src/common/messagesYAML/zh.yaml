Vault: 笔记库
Vault and database revision: 笔记库与数据库修订版本
Vault file: 笔记库文件
Vault file is newer: 笔记库文件较新
"We are about to retrieve the remote data.\n\nFirstly, how shall we handle the data retrieved from this remote source?\n\n- **${NEWER_WINS}**: Compares the modified time of files and takes the newer one.\n  If you have been using Self-hosted LiveSync and have made changes on multiple devices, this option may be suitable for you as it tries to merge changes based on modified time.\n- **${REMOTE_WINS}**: Remote data is the source of truth.\n  If you are new to using Self-hosted LiveSync. This option may be easiest to understand and get started with.\n  It will overwrite all your local files with the remote data, so please make sure you have a backup if there is any important data in your vault.\n- **${DETAILED}**: Opens the detailed setup wizard.\n  If you want to have more control over the synchronisation process, or want to review the changes before applying, you can choose this option to use the detailed flow.": "即将获取远程数据。


  首先，应如何处理从此远程来源获取的数据？


  - **${NEWER_WINS}**：比较文件的修改时间，采用较新的版本。

  \  如果你一直在使用 Self-hosted LiveSync，并在多台设备上做过修改，此选项可能适合你，因为它会尝试根据修改时间合并变更。

  - **${REMOTE_WINS}**：以远程数据为准。

  \  如果你刚开始使用 Self-hosted LiveSync，此选项可能最容易理解和上手。

  \  它会用远程数据覆盖所有本地文件，因此如果笔记库中有重要数据，请确保已做好备份。

  - **${DETAILED}**：打开详细设置向导。

  \  如果你希望更好地控制同步过程，或想在应用前查看变更，可以选择此选项使用详细流程。"
WebRTC encrypts data between your devices, including when it passes through TURN. The TURN provider cannot read the transferred data. It can see network addresses and traffic volume.: WebRTC 会对设备之间的数据进行加密，经过 TURN 时也是如此。TURN 服务商无法读取传输的数据，但可以看到网络地址和流量大小。
When enabled, this device notifies connected peers after a local change. The notification contains no Vault data; a peer which follows this device then fetches the change through the encrypted P2P connection.: 启用后，本设备在本地发生变更后会通知已连接的对等方。通知中不包含笔记库数据；跟随本设备的对等方随后会通过加密的 P2P 连接获取变更。
While enabled, it causes very performance impact but debugging replication testing and other features will be enabled. Please disable this if you have not read the source code. Requires restart of Obsidian. Sometimes there is no implementation.: 启用后会严重影响性能，但会启用复制测试调试等功能。如果你没有读过源代码，请停用此项。需要重启 Obsidian。部分功能可能尚未实现。
