Unsupported TURN configuration: 不支持的 TURN 配置
Use JWT instead of Basic Authentication: 使用 JWT 代替 Basic 认证
Use Only Local Chunks: 仅使用本地块
Use Request API to avoid `inevitable` CORS problem: 使用 Request API 规避`无法避免的`CORS 问题
Use the detailed flow: 使用详细流程
Use the project's public signalling relay: 使用项目的公共信令中继
