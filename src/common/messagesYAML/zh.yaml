"Since you have chosen to overwrite all local files with remote data, **how would you like to handle local files that are not present in the remote database?**\n\n- **${DELETE_ALL}**: Local-only files and remote-deleted files will be removed.\n  This option will make your local vault exactly the same as the remote database, but please make sure you have a backup if there is any important data in your vault.\n- **${DELETE_NONE}**: All existing local files will be preserved.\n  This option will keep all your local files, but it may cause duplicates if there are files that exist on local but not on remote. You can clean up these duplicates manually after the synchronisation.": "由于你选择了用远程数据覆盖所有本地文件，**远程数据库中不存在的本地文件应如何处理？**


  - **${DELETE_ALL}**：删除仅存在于本地的文件和远程已删除的文件。

  \  此选项会让本地笔记库与远程数据库完全一致，但如果笔记库中有重要数据，请确保已做好备份。

  - **${DELETE_NONE}**：保留所有现有的本地文件。

  \  此选项会保留所有本地文件，但如果有文件只存在于本地而不在远程，可能会产生重复。同步完成后可以手动清理这些重复文件。"
Skips checking and applying synchronisation settings from the remote.: 跳过检查和应用远程的同步设置。
Smaller messages can improve compatibility on paths which fragment or drop larger WebRTC messages. This setting limits outgoing P2P messages, so use a compatible profile on each sending device when required.: 如果网络路径会分片或丢弃较大的 WebRTC 消息，使用较小的消息可以提高兼容性。此设置限制发出的 P2P 消息，因此必要时请在每台发送设备上使用兼容的配置档。
Some files failed to synchronise. What would you like to do?: 部分文件同步失败。你想怎么做？
