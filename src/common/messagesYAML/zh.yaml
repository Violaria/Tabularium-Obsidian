Shared ancestor ${REVISION} is not readable on this device. Automatic three-way merging may be unavailable, but the live revisions remain available for explicit review.: 共同祖先 ${REVISION} 在本设备上无法读取。自动三方合并可能不可用，但活动修订版本仍可供明确审查。
