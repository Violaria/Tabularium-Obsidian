Test connection and save: 测试连接并保存
Test Settings and Continue: 测试设置并继续
Testing only - Resolve file conflicts by syncing newer copies of the file, this can overwrite modified files. Be Warned.: "仅供测试 - 通过同步文件的较新副本来解决文件冲突,这可能会覆盖修改过的文件。请注意 "
The connection test cannot add a signalling relay while P2P is active. Use the active relay settings, or disconnect P2P before testing.: P2P 处于活动状态时，连接测试无法添加信令中继。请使用当前生效的中继设置，或先断开 P2P 再测试。
The connection to the server has been configured successfully. As the next step,: 与服务器的连接已配置成功。下一步，
The delay for consecutive on-demand fetches: 连续按需获取的延迟
The files in this Vault are almost identical to the server's.: 本库中的文件与服务器上的几乎一致。
"The following accepted nodes are missing its node information:\n- ${missingNodes}\n\nThis indicates that they have not been connected for some time or have been left on an older version.\nIt is preferable to update all devices if possible. If you have any devices that are no longer in use, you can clear all accepted nodes by locking the remote once.": |-
  以下已接受节点缺少节点信息：
  - ${missingNodes}

  这表示它们已有一段时间未连接，或仍停留在较旧版本。
  如有可能，建议先更新所有设备。如果有已不再使用的设备，可以先锁定一次远程端以清除全部已接受节点。
The Group ID and passphrase are used to identify your group of devices. Make sure to use the same Group ID and passphrase on all devices you want to synchronise.: 组 ID 和密码短语用于标识你的设备组。请确保所有要同步的设备都使用相同的组 ID 和密码短语。
The Hash algorithm for chunk IDs: 块 ID 的哈希算法(实验性)
The IndexedDB adapter often offers superior performance in certain scenarios, but it has been found to cause memory leaks when used with LiveSync mode. When using LiveSync mode, please use IDB adapter instead.: IndexedDB 适配器在某些场景下性能更好，但已发现与 LiveSync 模式同用时会造成内存泄漏。使用 LiveSync 模式时，请改用 IDB 适配器。
the latest synchronisation data will be downloaded from the server to this device.: 最新的同步数据将从服务器下载到本设备。
the local database, that is to say the synchronisation information, must be reconstituted.: 本地数据库（即同步信息）必须重建。
The maximum duration for which chunks can be incubated within the document. Chunks exceeding this period will graduate to independent chunks.: "文档中可以孵化的数据块的最大持续时间。超过此时间的数据块将成为独立数据块 "
The maximum number of chunks that can be incubated within the document. Chunks exceeding this number will immediately graduate to independent chunks.: "文档中可以孵化的数据块的最大数量。超过此数量的数据块将立即成为独立数据块 "
The maximum total size of chunks that can be incubated within the document. Chunks exceeding this size will immediately graduate to independent chunks.: "文档中可以孵化的数据块的最大总大小。超过此大小的数据块将立即成为独立数据块 "
The minimum interval for automatic synchronisation on event.: 基于事件自动同步的最小间隔。
The remote database is locked for synchronisation to prevent vault corruption because this device is not marked as 'resolved'. Please back up your vault, reset the local database, and select 'Mark this device as resolved'. This warning will persist until replication confirms the device is resolved.: 为防止数据仓库损坏，由于此设备尚未标记为“已确认”，远程数据库已被锁定，暂停同步。请先备份你的仓库、重置本地数据库，然后选择“将此设备标记为已确认”。在复制过程确认此设备已完成确认之前，此警告会持续显示。
The remote is already set up, and the configuration is compatible (or got compatible by this operation).: 远端已设置好，且配置兼容（或经此操作后已兼容）。
The Setup-URI does not appear to be valid. Please check that you have copied it correctly.: 设置 URI 似乎无效。请检查是否完整复制。
The Setup-URI is valid and ready to use.: 设置 URI 有效，可以使用。
the single, authoritative master copy: 唯一的权威主副本
the synchronisation data on the server will be built based on the current data on this device.: 服务器上的同步数据将基于本设备的当前数据构建。
Themes: 主题
There is a way to resolve this on other devices.: 在其他设备上有办法解决这个问题。
There may be differences between the files in this Vault and the server.: 本库中的文件与服务器上可能存在差异。
Therefore, we ask that you exercise extreme caution when configuring server information manually. If an incorrect passphrase is entered, the data on the server will become corrupted.: 因此，我们要求你在手动配置服务器信息时格外小心。如果输入了错误的密码短语，服务器上的数据将会损坏。
This can isolate your connections between devices. Use the same Room ID for the same devices.: 这可以隔离设备之间的连接。同一组设备请使用相同的房间 ID。
This device: 本设备
This device name: 本设备名称
This feature enables direct synchronisation between devices. No server is required, but both devices must be online at the same time for synchronisation to occur, and some features may be limited. Internet connection is only required to signalling (detecting peers) and not for data transfer.: 此功能可在设备之间直接同步，无需服务器；但同步时两台设备必须同时在线，且部分功能可能受限。互联网连接仅用于信令（发现对端），不用于数据传输。
This first setup has several short steps because it confirms encryption, the connection method, and which device provides the initial data. Once it is complete, additional devices can reuse a Setup URI.: 首次设置分为几个简短步骤，因为它要确认加密方式、连接方式，以及由哪台设备提供初始数据。完成后，其他设备可以复用设置 URI。
This is an advanced option for users who do not have a URI or who wish to configure detailed settings.: 这是面向没有 URI 或希望手动配置详细参数的高级选项。
This is an extremely powerful operation. We strongly recommend that you copy your Vault folder to a safe location.: 这是一项影响极大的操作。我们强烈建议先把库文件夹复制到安全位置。
This is the most suitable synchronisation method for the design. All functions are available. You must have set up a CouchDB instance.: 这是最符合当前设计的同步方式，所有功能均可用。你需要事先部署好 CouchDB 实例。
This optional check uses Obsidian's internal request API and sends the credentials above to the CouchDB server. Use it only with a server you trust; administrator access may be required.: 此可选检查使用 Obsidian 的内部请求 API，并把上面的凭据发送到 CouchDB 服务器。请仅对你信任的服务器使用；可能需要管理员权限。
This passphrase will not be copied to another device. It will be set to `Default` until you configure it again.: "此密码不会复制到另一台设备。在您再次配置之前,它将设置为 `Default` "
This password is used to encrypt the connection. Use something long enough.: 此密码用于加密连接。请设置得足够长。
This procedure will first delete all existing synchronisation data from the server. Following this, the server data will be completely rebuilt, using the current state of your Vault on this device (including its local database) as: 此操作会先删除服务器上所有现有的同步数据。随后，服务器数据将被完全重建，以本设备上你库的当前状态（包括其本地数据库）作为
This setting must be the same even when connecting to multiple synchronisation destinations.: 即使连接到多个同步目标，此设置也必须保持一致。
This Vault is empty, or contains only new files that are not on the server.: 本库为空，或只包含服务器上没有的新文件。
This will rebuild the local database on this device using the most recent data from the server. This action is designed to resolve synchronisation inconsistencies and restore correct functionality.: 这将用服务器上的最新数据重建本设备的本地数据库。此操作旨在解决同步不一致并恢复正常功能。
This will recreate chunks for all files. If there were missing chunks, this may fix the errors.: 这会为所有文件重新生成 chunks。如果之前存在缺失的 chunks，这可能修复相关错误。
To minimise the creation of new conflicts: 以减少新冲突的产生
To prevent unwanted vault corruption, the remote database has been locked for synchronisation. (This device is marked as 'resolved'.) When all your devices are marked as 'resolved', unlock the database. This warning will continue to appear until replication confirms the device is resolved.: 为防止意外的数据仓库损坏，远程数据库已被锁定，暂停同步。（此设备已被标记为“已确认”）当你的所有设备都标记为“已确认”后，再解锁数据库。在复制过程确认此设备已完成确认之前，此警告会持续显示。
Transfer Tweak: 传输微调
TURN Credential: TURN 凭据
TURN server settings are only necessary if you are behind a strict NAT or firewall that prevents direct P2P connections. In most cases, you can leave these fields blank.: 只有当处于阻止直接 P2P 连接的严格 NAT 或防火墙之后时，才需要 TURN 服务器设置。大多数情况下这些字段可以留空。
TURN Server URLs (comma-separated): TURN 服务器地址（逗号分隔）
TURN Username: TURN 用户名
TweakMismatchResolve:
  Action:
    DisableAutoAcceptCompatible: 停用自动接受
    Dismiss: Dismiss
    EnableAutoAcceptCompatible: 启用自动接受
    UseConfigured: Use configured settings
    UseMine: Update remote database settings
    UseMineAcceptIncompatible: Update remote database settings but keep as is
    UseMineWithRebuild: Update remote database settings and rebuild again
    UseRemote: Apply settings to this device
    UseRemoteAcceptIncompatible: Apply settings to this device, but and ignore incompatibility
    UseRemoteWithRebuild: Apply settings to this device, and fetch again
  Message:
    AutoAcceptCompatibleUndefined: |-
      
      各设备的设置似乎存在差异。你现在可以自动应用兼容的更改到这些配置。
      是否要启用此「自动接受」设置？
    Main: >-
      
      The settings in the remote database are as follows. These values are configured by other devices, which are synchronised with this device at least once.


      If you want to use these settings, please select %{TweakMismatchResolve.Action.UseConfigured}.

      If you want to keep the settings of this device, please select %{TweakMismatchResolve.Action.Dismiss}.


      ${table}


      >[!TIP]

      > If you want to synchronise all settings, please use `Sync settings via markdown` after applying minimal configuration with this feature.


      ${additionalMessage}
    MainTweakResolving: |-
      Your configuration has not been matched with the one on the remote server.

      Following configuration should be matched:

      ${table}

      Let us know your decision.

      ${additionalMessage}
    mineUpdated: 本设备的配置已调整。
    remoteUpdated: 远端存储的配置已更新。
    UseRemote:
      WarningRebuildRecommended: >-
        
        >[!NOTICE]

        > Some changes are compatible but may consume extra storage and transfer volumes. A rebuild is recommended. However, a rebuild may not be performed at present, but may be implemented in future maintenance.

        > ***Please ensure that you have time and are connected to a stable network to apply!***
      WarningRebuildRequired: >-
        
        >[!WARNING]

        > Some remote configurations are not compatible with the local database of this device. Rebuilding the local database will be required.

        > ***Please ensure that you have time and are connected to a stable network to apply!***
    WarningIncompatibleRebuildRecommended: >-
      
      >[!NOTICE]

      > We have detected that some of the values are different to make incompatible the local database with the remote database.

      > Some changes are compatible but may consume extra storage and transfer volumes. A rebuild is recommended. However, a rebuild may not be performed at present, but may be implemented in future maintenance.

      > If you want to rebuild, it takes a few minutes or more. **Make sure it is safe to perform it now.**
    WarningIncompatibleRebuildRequired: >-
      
      >[!WARNING]

      > We have detected that some of the values are different to make incompatible the local database with the remote database.

      > Either local or remote rebuilds are required. Both of them takes a few minutes or more. **Make sure it is safe to perform it now.**
  Table:
    _value: |+
      | Value name | This device | On Remote |
      |: --- |: ---- :|: ---- :|
      ${rows}

    Row: "| ${name} | ${self} | ${remote} |"
  Title:
    _value: Configuration Mismatch Detected
    AutoAcceptCompatible: 可自动接受
    TweakResolving: Configuration Mismatch Detected
    UseRemoteConfig: Use Remote Configuration
