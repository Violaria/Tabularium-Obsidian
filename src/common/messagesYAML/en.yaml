cmdLocalDatabaseMainte:
    commandGCV3: Garbage Collection V3 (advanced, beta)
    retrievingChunks: Retrieving chunks informations..
    operation:
        resurrectChunks: Resurrect Chunks
        deleteFiles: Delete Files
        deleteChunks: Delete Chunks
        markUnusedChunks: Mark unused chunks
        deleteUnusedChunks: Delete unused chunks
        trackChunkUsage: Track chunk usage
        garbageCollection: Garbage Collection
    buttonResurrect: Resurrect
    buttonMark: Mark
    deletionCancelled: Deletion operation is cancelled.
    resurrect:
        none: No chunks are found to be resurrected.
        message: |-
            We have following chunks that are deleted but still used in the database.

            - Completely lost chunks: ${lost}
            - Resurrectable chunks: ${resurrectable}

            Do you want to resurrect these chunks?
        result: "Resurrected chunks: ${resurrected} / ${total}"
        cancelled: Resurrect operation is cancelled.
    deleteFiles:
        searching: Searching for deleted files..
        none: No deleted files found.
        found: Found ${count} deleted files.
        message: |-
            We have following files that are marked as deleted.

            - Deleted files: ${count}

            Are you sure to delete these files permanently?

            Note: **Make sure to synchronise all devices before deletion.**

            > [!Note]
            > This operation affects the database permanently. Deleted files will not be recovered after this operation.
            > And, the chunks that are used in the deleted files will be ready for compaction.
        result: Deleted ${deleted} / ${total} files.
    deleteChunks:
        none: No deleted chunks found.
        message: |-
            We have following chunks that are marked as deleted.

            - Deleted chunks: ${count} (${size})

            Are you sure to delete these chunks permanently?

            Note: **Make sure to synchronise all devices before deletion.**

            > [!Note]
            > This operation finally reduces the capacity of the remote.
        result: "Deleted chunks: ${deleted} / ${total}"
    unusedChunks:
        none: No unused chunks found.
        markMessage: |-
            We have following chunks that are not used from any files.

            - Chunks: ${count} (${size})

            Are you sure to mark these chunks to be deleted?

            Note: **Make sure to synchronise all devices before deletion.**

            > [!Note]
            > This operation will not reduces the capacity of the remote until permanent deletion.
        markResult: "Marked chunks: ${marked} / ${total}"
        deleteMessage: |-
            We have following chunks that are not used from any files.

            - Chunks: ${count} (${size})

            Are you sure to delete these chunks?

            Note: **Make sure to synchronise all devices before deletion.**

            > [!Note]
            > Chunks referenced from deleted files are not deleted. Please run "Commit File Deletion" before this operation.
    trackSummary: |-
        Total chunks: ${total}
        Unused chunks: ${unused}
    gc:
        title: Are all devices synchronised?
        message: |-
            This function deletes unused chunks from the device. If there are differences between devices, some chunks may be missing when resolving conflicts.
            Be sure to synchronise before executing.

            If chunks used by current Vault files are deleted, Hatch -> Recreate chunks for current Vault files can recreate them only from files currently present in the Vault. It cannot recover unreadable historical or conflict content.

            Are you ready to delete unused chunks?
        buttonDelete: Yes, delete chunks
        cancelled: User cancelled chunk deletion
        deleting: "Deleting chunks: ${count}"
        completed: |-
            Garbage Collection completed.
            Success: ${success}, Errored: ${errored}
    oldRevisionsFound: Found ${count} old revisions for ${id} . ${toCheck} items to check
    revisionLookupFailed: Error finding revisions for ${id}
