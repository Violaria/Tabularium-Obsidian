"tabularium.help.connect.body": "Open Connection and sign in with your account on the Tabularium server. Choose an existing vault or create a new one, name this device, and enter the vault's passphrase.\n\nAn existing vault is fetched to this device first; a new vault is filled from this device's files. To use another vault, choose Sign in again or change vault. Disconnect forgets the connection on this device only; the device stays listed on the server until it is removed there.\n\nDevice credentials last 30 days and renew themselves while the device is used."
"tabularium.help.connect.title": "Connecting and changing vaults"
"tabularium.help.errors.body": "Credentials no longer valid: the device was removed on the server or its credentials expired. Sign in again.\n\nEncryption settings refused: this device's settings differ from the vault's. Disconnect and connect again.\n\nA rebuild is in progress: wait until the owner ends it on the web.\n\nA note does not synchronise: check the size limit and the excluded files under Sync, and look in the log.\n\nThe first synchronisation of a large vault takes a while; keep Obsidian open until the status shows Up to date."
"tabularium.help.errors.title": "Common problems"
"tabularium.help.migrate.body": "Tabularium can run beside the plug-in \"self-hosted-livesync\" in the same vault: each synchronises with its own server, and neither uses the other's local database, settings or flag files. To move your notes, connect to the vault on the Tabularium server that already holds them, so this device fetches it; then turn the old plug-in off, or keep it to synchronise with another server.\n\nIf the old plug-in also synchronises hidden files, exclude .obsidian/plugins/tabularium/ there: it holds this device's credentials."
"tabularium.help.migrate.title": "Moving from the old plug-in"
"tabularium.help.passphrase.body": "Notes are encrypted on each device with the vault's passphrase before they are sent; the server cannot read them. Every device of a vault uses the same passphrase.\n\nThe passphrase cannot be recovered. If it is lost, the notes on the server cannot be decrypted; devices that still have the files can create a new vault from them."
"tabularium.help.passphrase.title": "The vault passphrase"
"tabularium.help.rebuild.body": "A rebuild replaces the vault on the server with one device's files, for example to clean up old data. The owner authorises the device on the web (Account settings, Vaults and devices, Rebuild vault), then runs Overwrite the server with this device in Maintenance on that device.\n\nAfterwards the vault is locked. Each other device shows Vault locked and must fetch from the server. When all of them have fetched, unlock the vault here or on the web."
"tabularium.help.rebuild.title": "Rebuilding and unlocking"
"tabularium.help.status.body": "The status bar shows the connection and counters. Up to date means nothing is waiting. Changes waiting counts files that have not been sent yet; they are sent with the next synchronisation.\n\nWhen the device is offline, changes are kept and sent once it is back online. A failed synchronisation is explained in the log (Maintenance, Log)."
"tabularium.help.status.title": "What the sync status means"
"tabularium.release.0.12.0": "Tabularium names throughout the plug-in; large vaults synchronise reliably; misleading version notices removed."
"tabularium.release.0.13.0": "One web application: home, web notes, Tabularius and administration."
"tabularium.release.0.14.0": "Share a note or folder as an encrypted link from the file menu."
"tabularium.release.0.15.0": "Tabularius, the AI clerk, is set up on the web; web notes read like Obsidian."
"tabularium.release.0.16.0": "The server's settings, including mail for Send to Kindle, are changed on the web."
"tabularium.release.0.17.0": "Tabularius answers with recipes: a model with its parameters and a prompt, set up by an administrator; conversations can adjust them."
"tabularium.release.0.18.0": "New settings page arranged by use: connection, sync, file sorting, Send to Kindle, appearance, maintenance and help.\nBuilt-in help and version history in three languages.\nConfirmations say what happens and what it means for other devices.\nUpstream entries that do not apply to a Tabularium server are gone: remote configuration, setup URIs and QR codes, onboarding, hidden-file and customisation sync, P2P."
"tabularium.release.0.3.0": "Connect with a Tabularium login; Send to Kindle; web notes; credentials renew themselves."
"tabularium.release.0.4.0": "Interface in English, Chinese and Latin; web notes can be edited."
"tabularium.release.0.5.0": "Tabularius, the AI clerk, answers questions about a vault and proposes changes (0.5 to 0.11)."
